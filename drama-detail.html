<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 短剧详情</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.12);
      --accent-glow: rgba(0, 179, 136, 0.25);
      --text: #13202e;
      --text-muted: #5e6f83;
      --border: #deeaf7;
      --shadow-sm: 0 4px 12px rgba(27, 45, 71, 0.06);
      --shadow-md: 0 12px 28px rgba(27, 45, 71, 0.07);
      --shadow-lg: 0 20px 45px rgba(27, 45, 71, 0.10);
      --radius: 24px;
      --radius-lg: 32px;
      --danger: #f45b69;
      --warning: #ff9f2c;
      font-family: "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); scroll-behavior: smooth; overflow-x: hidden; width: 100%; max-width: 100%; }
    .app-shell { max-width: 1440px; margin: 0 auto; padding: 24px; width: 100%; overflow-x: hidden; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-top: 40px; margin-bottom: 20px; font-size: 0.92rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--border); }

    /* ===== Auth Styles ===== */
    .auth-container { display: flex; align-items: center; }
    .auth-login-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
    .auth-login-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .auth-login-icon { font-size: 1rem; }
    .auth-user-menu { position: relative; }
    .auth-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 2px solid var(--accent-soft); transition: border-color 0.2s; position: relative; flex-shrink: 0; }
    .auth-avatar:hover { border-color: var(--accent); }
    .auth-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .auth-avatar-dot { position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); }
    .auth-dropdown { position: absolute; top: calc(100% + 10px); right: 0; width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 40px rgba(27,45,71,0.15); opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.25s ease; z-index: 100; overflow: hidden; }
    .auth-dropdown.active { opacity: 1; visibility: visible; transform: translateY(0); }
    .auth-dropdown-header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
    .auth-dropdown-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .auth-dropdown-name { font-weight: 600; font-size: 0.92rem; color: var(--text); }
    .auth-dropdown-wallet { font-size: 0.78rem; color: var(--text-muted); font-family: monospace; margin-top: 2px; }
    .auth-dropdown-divider { height: 1px; background: var(--border); margin: 0; }
    .auth-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: var(--text); text-decoration: none; font-size: 0.9rem; transition: background 0.15s; cursor: pointer; }
    .auth-dropdown-item:hover { background: rgba(0,0,0,0.03); }
    .auth-dropdown-item span { font-size: 1.1rem; }
    .auth-dropdown-logout { color: #f45b69; }
    .auth-dropdown-logout:hover { background: rgba(244,91,105,0.06); }
    /* Login Modal */
    .auth-modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .auth-modal-overlay.active { opacity: 1; visibility: visible; }
    .auth-modal { background: var(--surface); border-radius: 28px; width: 100%; max-width: 420px; box-shadow: 0 40px 80px rgba(27,45,71,0.2); overflow: hidden; transform: scale(0.95) translateY(10px); transition: transform 0.3s ease; }
    .auth-modal-overlay.active .auth-modal { transform: scale(1) translateY(0); }
    .auth-modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.04); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text-muted); transition: all 0.2s; z-index: 1; }
    .auth-modal-close:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    .auth-modal-header { text-align: center; padding: 36px 28px 20px; position: relative; }
    .auth-modal-logo { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #00d4a3); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.3rem; margin: 0 auto 16px; box-shadow: 0 4px 16px rgba(0,179,136,0.3); }
    .auth-modal-header h2 { margin: 0 0 6px; font-size: 1.4rem; }
    .auth-modal-header p { margin: 0; color: var(--text-muted); font-size: 0.92rem; }
    .auth-modal-body { padding: 8px 28px 32px; display: flex; flex-direction: column; gap: 12px; }
    .auth-social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .auth-social-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .auth-social-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.85rem; margin: 4px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .auth-wallet-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 14px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .auth-wallet-btn:hover { background: rgba(0,179,136,0.2); }
    .auth-modal-tos { text-align: center; color: var(--text-muted); font-size: 0.82rem; line-height: 1.6; margin: 4px 0 0; }
    .auth-modal-tos a { color: var(--accent); text-decoration: none; }
    .auth-modal-tos a:hover { text-decoration: underline; }
    .auth-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); z-index: 10000; background: rgba(26,35,47,0.95); backdrop-filter: blur(8px); color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 0.92rem; box-shadow: 0 12px 40px rgba(27,45,71,0.25); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease; opacity: 0; pointer-events: none; max-width: 400px; text-align: center; font-weight: 500; }
    .auth-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    /* ===== End Auth Styles ===== */
    .detail-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; margin-bottom: 32px; min-width: 0; }
    @media (max-width: 1024px) { .detail-layout { grid-template-columns: 1fr; } }
    .player-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-lg); overflow: hidden; background: #0a0e17; box-shadow: var(--shadow-lg); }
    .player-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); gap: 16px; cursor: pointer; transition: all 0.3s ease; position: relative; }
    .player-placeholder:hover { background: rgba(255,255,255,0.03); }
    .player-placeholder .play-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(0,179,136,0.85); display: grid; place-items: center; font-size: 2rem; color: #fff; transition: transform 0.3s ease, box-shadow 0.3s ease; box-shadow: 0 8px 32px rgba(0,179,136,0.35); }
    .player-placeholder:hover .play-icon { transform: scale(1.08); box-shadow: 0 12px 40px rgba(0,179,136,0.50); }
    .player-placeholder .episode-label { font-size: 0.95rem; color: rgba(255,255,255,0.6); }
    .player-placeholder .bg-gradient { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,179,136,0.08), rgba(0,0,0,0.4)); pointer-events: none; }
    .player-placeholder img.bg-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
    .player-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); display: flex; align-items: center; gap: 14px; opacity: 0; transition: opacity 0.3s ease; }
    .player-wrapper:hover .player-controls { opacity: 1; }
    .player-controls .ctrl-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 1rem; transition: background 0.2s; }
    .player-controls .ctrl-btn:hover { background: rgba(255,255,255,0.25); }
    .player-controls .progress-bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.2); cursor: pointer; position: relative; }
    .player-controls .progress-bar .fill { height: 100%; width: 0%; border-radius: 4px; background: var(--accent); transition: width 0.3s ease; }
    .player-controls .time { color: rgba(255,255,255,0.7); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .sidebar { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); }
    .info-card .drama-title { margin: 0 0 6px; font-size: 1.6rem; line-height: 1.2; }
    .info-card .drama-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .info-card .drama-meta .tag { padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.82rem; font-weight: 600; }
    .info-card .drama-meta .tag.muted { background: rgba(15,22,42,0.05); color: var(--text-muted); }
    .info-card .drama-stats-highlight { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
    .info-card .drama-stats-highlight .stat { text-align: center; padding: 14px 8px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-soft), rgba(0,179,136,0.06)); border: 1px solid rgba(0,179,136,0.15); }
    .info-card .drama-stats-highlight .stat .num { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .info-card .drama-stats-highlight .stat .label { display: block; font-size: 0.82rem; color: var(--accent); margin-top: 2px; font-weight: 500; }
    .button, .button-secondary { border: none; cursor: pointer; border-radius: 999px; padding: 12px 24px; font-size: 0.95rem; transition: all 0.25s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .button { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(0,179,136,0.30); }
    .button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,179,136,0.40); }
    .button-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .button-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .synopsis { margin-bottom: 16px; }
    .synopsis h4 { margin: 0 0 8px; font-size: 1rem; }
    .synopsis .synopsis-text { margin: 0; color: var(--text-muted); line-height: 1.8; font-size: 0.92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .synopsis .synopsis-text.expanded { -webkit-line-clamp: unset; }
    .synopsis .expand-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.88rem; padding: 4px 0; font-weight: 600; }
    .episode-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
    .episode-panel .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .episode-panel .panel-header h3 { margin: 0; font-size: 1.05rem; }
    .episode-panel .panel-header .ep-count { color: var(--text-muted); font-size: 0.88rem; }
    .episode-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; padding: 14px 16px; max-height: 420px; overflow-y: auto; }
    .episode-list::-webkit-scrollbar { width: 4px; }
    .episode-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .ep-item { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); background: rgba(15,22,42,0.03); transition: all 0.2s ease; }
    .ep-item:hover { background: var(--accent-soft); color: var(--accent); }
    .ep-item.active { background: var(--accent); color: #fff; }
    .cast-section { margin-top: 28px; }
    .cast-section h3 { margin: 0 0 16px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
    .cast-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .cast-scroll::-webkit-scrollbar { display: none; }
    .cast-card { flex-shrink: 0; width: 130px; text-align: center; cursor: pointer; transition: transform 0.25s ease; }
    .cast-card:hover { transform: translateY(-4px); }
    .cast-card.unbound { cursor: default; }
    .cast-card.unbound:hover { transform: none; }
    .cast-card.unbound:hover .c-avatar-wrap .c-avatar { border-color: var(--accent-soft); }
    .cast-card .c-avatar-wrap { position: relative; width: 90px; height: 90px; margin: 0 auto 10px; }
    .cast-card .c-avatar-wrap .c-avatar { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 2.5px solid var(--accent-soft); transition: border-color 0.25s; }
    .cast-card:hover .c-avatar-wrap .c-avatar { border-color: var(--accent); }
    .cast-card .c-avatar-wrap .c-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cast-card .c-avatar-wrap .c-badge { position: absolute; bottom: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; border: 2px solid var(--surface); }
    .cast-card .c-avatar-wrap .c-badge.bound { background: var(--accent); color: #fff; }
    .cast-card .c-avatar-wrap .c-badge.unbound { background: var(--text-muted); color: #fff; font-size: 0.65rem; }
    .cast-card .c-actor-line { font-size: 0.98rem; font-weight: 700; margin-bottom: 2px; }
    .cast-card .c-actor-line.bound { color: var(--accent); }
    .cast-card .c-actor-line.unbound { color: var(--text-muted); }
    .cast-card .c-name { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); }
    .cast-card .c-name .c-role-suffix { color: var(--text-muted); font-weight: 400; }
    .comments-section { margin-top: 28px; }
    .comments-section h3 { margin: 0 0 16px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
    .comment-input-wrap { display: flex; gap: 12px; margin-bottom: 20px; }
    .comment-input-wrap .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .comment-input-wrap .input-group { flex: 1; display: flex; gap: 10px; }
    .comment-input-wrap input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 999px; font-size: 0.92rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
    .comment-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .comment-input-wrap .send-btn { padding: 10px 20px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .comment-input-wrap .send-btn:hover { background: #009a75; }
    .comment-list { display: flex; flex-direction: column; gap: 14px; }
    .comment-item { display: flex; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
    .comment-item .c-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
    .comment-item .c-body { flex: 1; min-width: 0; }
    .comment-item .c-body .c-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 2px; }
    .comment-item .c-body .c-text { color: var(--text); line-height: 1.6; font-size: 0.9rem; }
    .comment-item .c-body .c-time { color: var(--text-muted); font-size: 0.78rem; margin-top: 4px; }
    .comment-item .c-actions { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; min-width: 44px; }
    .comment-item .c-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px 4px; transition: color 0.2s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .comment-item .c-actions button:hover { color: var(--accent); }
    .comment-item .c-actions button.active { color: var(--accent); }
    .comment-item .c-actions button.active svg { fill: var(--accent); }
    .comment-item .c-actions button svg { width: 20px; height: 20px; }
    .comment-item .c-actions button .c-like-num { font-size: 0.76rem; font-weight: 500; }
    .drama-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .drama-actions .action-btn-icon { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 999px; border: none; background: var(--accent-soft); color: var(--accent); cursor: pointer; transition: all 0.2s ease; }
    .drama-actions .action-btn-icon:hover { background: rgba(0,179,136,0.22); }
    .drama-actions .action-btn-icon.active { background: var(--accent); color: #fff; }
    .drama-actions .action-btn-icon .aicon { width: 22px; height: 22px; flex-shrink: 0; }
    .drama-actions .action-btn-icon .acount { font-size: 0.9rem; font-weight: 600; }
    .toast-notification { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); z-index: 9999; background: rgba(26, 35, 47, 0.95); backdrop-filter: blur(8px); color: #fff; padding: 16px 24px; border-radius: 16px; font-size: 0.92rem; line-height: 1.6; box-shadow: 0 12px 40px rgba(27, 45, 71, 0.25); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; opacity: 0; pointer-events: none; max-width: 420px; text-align: center; font-weight: 500; }
    .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-notification .toast-icon { display: inline-block; margin-right: 8px; font-size: 1.1rem; }

    /* ===== Rating Modal ===== */
    .rating-modal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .rating-modal-overlay.active { opacity: 1; visibility: visible; }
    .rating-modal { background: var(--surface); border-radius: 28px; width: 100%; max-width: 400px; box-shadow: 0 40px 80px rgba(27,45,71,0.2); overflow: hidden; transform: scale(0.95) translateY(10px); transition: transform 0.3s ease; }
    .rating-modal-overlay.active .rating-modal { transform: scale(1) translateY(0); }
    .rating-modal-header { text-align: center; padding: 32px 24px 8px; position: relative; }
    .rating-modal-header h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .rating-modal-header p { margin: 0; color: var(--text-muted); font-size: 0.88rem; }
    .rating-modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.04); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; color: var(--text-muted); transition: all 0.2s; z-index: 1; }
    .rating-modal-close:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    .rating-modal-body { padding: 16px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .rating-stars { display: flex; gap: 8px; }
    .rating-star { cursor: pointer; width: 44px; height: 44px; transition: transform 0.15s ease; }
    .rating-star:hover { transform: scale(1.15); }
    .rating-star svg { width: 100%; height: 100%; }
    .rating-star.active svg .star-fill { fill: #ff9f2c; }
    .rating-star.active svg .star-stroke { stroke: #ff9f2c; fill: #ff9f2c; }
    .rating-star.passive svg .star-stroke { stroke: #d0d9e5; }
    .rating-label { font-size: 1rem; font-weight: 600; color: var(--text-muted); min-height: 1.5em; }
    .rating-label.active { color: #ff9f2c; }
    .rating-submit-btn { width: 100%; padding: 12px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; }
    .rating-submit-btn:hover { background: #009a75; }
    .rating-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .rating-current { font-size: 0.9rem; color: var(--text-muted); text-align: center; padding-top: 8px; border-top: 1px solid var(--border); width: 100%; }
    .rating-current strong { color: var(--text); }
    /* ================================================================
       响应式 - 手机 (max-width: 680px)
       ================================================================ */
    @media (max-width: 680px) {

  <script>
    // ============================================================
    //  数据
    // ============================================================
    const DRAMA_DATA = {
      title: '重生之我在币圈当大佬',
      synopsis: '加密货币市场的至暗时刻，一场价值数百亿的赌局在AI短剧中上演。主角在一次意外中重生回到2015年，带着未来记忆的他，如何在币圈从一个小白成长为呼风唤雨的大佬？每一步抉择都关乎生死，每一次交易都是人性的考验。',
      synopsisFull: '加密货币市场的至暗时刻，一场价值数百亿的赌局在AI短剧中上演。主角在一次意外中重生回到2015年，带着未来记忆的他，如何在币圈从一个小白成长为呼风唤雨的大佬？每一步抉择都关乎生死，每一次交易都是人性的考验。\n\n从比特币的早期挖矿，到以太坊智能合约的爆发，再到DeFi浪潮和NFT狂潮，主角凭借先知先觉一步步布局。然而蝴蝶效应让历史悄然改变，新的对手、新的危机接踵而至。他不仅要与市场博弈，更要与人性中的贪婪和恐惧抗争。',

      categories: ['金融', '悬疑'],
      stats: { views: '12.8k', likes: 2300, favs: 856, rating: 4.8 },

      cast: [
        { name: '林逸', role: '主角', actor: '苏婉清', actorAvatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80', characterAvatar: 'https://i.pravatar.cc/200?img=11', bound: true },
        { name: '陈峰', role: '对手', actor: '李云飞', actorAvatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80', characterAvatar: 'https://i.pravatar.cc/200?img=12', bound: true },
        { name: '苏晴', role: '盟友', actor: '林梦瑶', actorAvatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80', characterAvatar: 'https://i.pravatar.cc/200?img=13', bound: true },
        { name: '赵老四', role: '反派', actor: null, actorAvatar: null, characterAvatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23e0f2fe%22/%3E%3Ccircle cx=%2250%22 cy=%2238%22 r=%2222%22 fill=%22%23374151%22/%3E%3Ccircle cx=%2240%22 cy=%2232%22 r=%224%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2260%22 cy=%2232%22 r=%224%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2240%22 cy=%2232%22 r=%222%22 fill=%22%23000%22/%3E%3Ccircle cx=%2260%22 cy=%2232%22 r=%222%22 fill=%22%23000%22/%3E%3Cpath d=%22M38 48 Q50 56 62 48%22 stroke=%22%23000%22 stroke-width=%222%22 fill=%22none%22/%3E%3Cpath d=%22M28 60 Q50 80 72 60%22 fill=%22%23374151%22/%3E%3C/svg%3E', bound: false },
        { name: '王教授', role: '导师', actor: null, actorAvatar: null, characterAvatar: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23fef3c7%22/%3E%3Ccircle cx=%2250%22 cy=%2238%22 r=%2222%22 fill=%22%2378716c%22/%3E%3Ccircle cx=%2240%22 cy=%2232%22 r=%224%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2260%22 cy=%2232%22 r=%224%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2240%22 cy=%2232%22 r=%222%22 fill=%22%23000%22/%3E%3Ccircle cx=%2260%22 cy=%2232%22 r=%222%22 fill=%22%23000%22/%3E%3Crect x=%2235%22 y=%2243%22 width=%2230%22 height=%224%22 rx=%222%22 fill=%22%23374151%22/%3E%3Cpath d=%22M25 58 Q50 82 75 58%22 fill=%22%2378716c%22/%3E%3C/svg%3E', bound: false },
      ],
      comments: [
        { id: 1, name: '加密小白', avatar: '加', text: '太精彩了！每一集都让人欲罢不能，特别是主角重生后的第一次交易，紧张刺激！', time: '2小时前', likes: 24 },
        { id: 2, name: '币圈老韭菜', avatar: '币', text: '作为真实经历过2015年牛市的老玩家，这部剧的细节还原度很高，强烈推荐！', time: '5小时前', likes: 18 },
        { id: 3, name: 'AI短剧迷', avatar: 'A', text: 'AI生成的剧情居然这么流畅，角色塑造也很立体，期待后续更新！', time: '1天前', likes: 12 },
      ]
    };

    // 生成剧集数据 - 全部免费播放，无需解锁
    for (let i = 1; i <= DRAMA_DATA.totalEpisodes; i++) {
      DRAMA_DATA.episodes.push({
        id: i,
        title: `第 ${i} 集`,
        desc: '',
        free: true,
        unlocked: true,
      });
    }

    // ============================================================
    //  状态
    // ============================================================
    let currentEp = 1;
    let isPlaying = false;
    let isLiked = false;
    let isFaved = false;
    let synopsisExpanded = false;

    // ============================================================
    //  评分
    // ============================================================
    let selectedRating = 0;
    let userRated = false;
    const RATING_LABELS = ['', '很差', '较差', '一般', '较好', '非常好'];
    const ratingData = {
      totalScore: 4.8,
      count: 124,
    };

    const STAR_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff9f2c"/><stop offset="100%" stop-color="#ffc107"/></linearGradient></defs><polygon class="star-stroke" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" stroke="#d0d9e5" fill="none"/><polygon class="star-fill" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="none"/></svg>`;

    function renderRatingStars() {
      const container = document.getElementById('ratingStars');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('div');
        star.className = 'rating-star passive';
        star.dataset.value = i;
        star.innerHTML = STAR_SVG;
        star.addEventListener('click', function() {
          if (userRated) return;
          selectRating(i);
        });
        star.addEventListener('mouseenter', function() {
          if (userRated) return;
          highlightStars(i);
        });
        container.appendChild(star);
      }
      // 鼠标离开容器时恢复为已选评分（或无选择时的默认状态）
      container.addEventListener('mouseleave', function() {
        if (userRated) return;
        if (selectedRating > 0) {
          highlightStars(selectedRating);
        } else {
          const stars = container.querySelectorAll('.rating-star');
          stars.forEach(star => star.className = 'rating-star passive');
          const label = document.getElementById('ratingLabel');
          label.textContent = '点击星星评分';
          label.className = 'rating-label';
        }
      });
    }

    function highlightStars(val) {
      const stars = document.querySelectorAll('.rating-star');
      stars.forEach((star, idx) => {
        star.className = 'rating-star' + (idx < val ? ' active' : ' passive');
      });
      const label = document.getElementById('ratingLabel');
      label.textContent = RATING_LABELS[val] || '';
      label.className = 'rating-label' + (val > 0 ? ' active' : '');
    }

    function selectRating(val) {
      selectedRating = val;
      highlightStars(val);
      document.getElementById('ratingSubmitBtn').disabled = false;
    }

    function openRatingModal() {
      document.getElementById('ratingModalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
      renderRatingStars();
      if (selectedRating > 0) {
        highlightStars(selectedRating);
        document.getElementById('ratingSubmitBtn').disabled = false;
      } else {
        document.getElementById('ratingLabel').textContent = '点击星星评分';
        document.getElementById('ratingLabel').className = 'rating-label';
      }
      // 更新综合评分显示
      document.getElementById('ratingCurrentScore').textContent = ratingData.totalScore.toFixed(1);
      document.getElementById('ratingCurrentCount').textContent = ratingData.count;
    }

    function closeRatingModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('ratingModalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function submitRating() {
      if (selectedRating === 0 || userRated) return;

      // 模拟提交评分
      const newTotal = (ratingData.totalScore * ratingData.count + selectedRating) / (ratingData.count + 1);
      ratingData.totalScore = Math.round(newTotal * 10) / 10;
      ratingData.count += 1;
      userRated = true;

      // 更新入口显示
      document.getElementById('ratingDisplay').textContent = ratingData.totalScore.toFixed(1);

      // 更新弹窗
      document.getElementById('ratingCurrentScore').textContent = ratingData.totalScore.toFixed(1);
      document.getElementById('ratingCurrentCount').textContent = ratingData.count;
      document.getElementById('ratingSubmitBtn').disabled = true;
      document.getElementById('ratingSubmitBtn').textContent = '已评分';

      // 锁定星星
      const stars = document.querySelectorAll('.rating-star');
      stars.forEach(star => star.style.cursor = 'default');

      const label = document.getElementById('ratingLabel');
      label.textContent = `你给了 ${selectedRating} 星 · ${RATING_LABELS[selectedRating]}`;

      showToast(`⭐ 评分成功！你给了 ${selectedRating} 星`, '⭐');

      // 3秒后关闭
      setTimeout(() => {
        closeRatingModal();
        document.getElementById('ratingSubmitBtn').textContent = '提交评分';
      }, 1500);
    }

    // ============================================================
    //  Toast
    // ============================================================
    let toastTimer = null;

    function showToast(msg, icon) {
      const t = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      if (icon) t.querySelector('.toast-icon').textContent = icon;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ============================================================
    //  播放器
    // ============================================================
    function playEpisode(epId) {
      const ep = epId || currentEp;
      currentEp = ep;
      const data = DRAMA_DATA.episodes[ep - 1];
      if (!data) return;

      const label = document.getElementById('currentEpLabel');
      label.textContent = `第 ${ep} 集`;

      // 模拟播放
      isPlaying = true;
      document.querySelector('.ctrl-btn').textContent = '⏸';
      showToast(`▶ 开始播放第 ${ep} 集`, '▶');

      // 更新选集高亮
      renderEpisodeList();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.querySelector('.ctrl-btn').textContent = isPlaying ? '⏸' : '▶';
    }

    function seekProgress(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function toggleFullscreen() {
      const el = document.getElementById('playerWrapper');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        el.requestFullscreen();
      }
    }

    // ============================================================
    //  点赞 / 收藏
    // ============================================================
    function toggleLike() {
      isLiked = !isLiked;
      document.getElementById('likeBtn2').classList.toggle('active', isLiked);
      let val = DRAMA_DATA.stats.likes + (isLiked ? 1 : -1);
      document.getElementById('likeCount2').textContent = val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val;
      showToast(isLiked ? '👍 已点赞' : '👎 已取消点赞', isLiked ? '👍' : '👎');
    }

    function toggleFav() {
      isFaved = !isFaved;
      document.getElementById('favBtn2').classList.toggle('active', isFaved);
      let val = DRAMA_DATA.stats.favs + (isFaved ? 1 : -1);
      document.getElementById('favCount2').textContent = val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val;
      showToast(isFaved ? '❤️ 已收藏' : '💔 已取消收藏', isFaved ? '❤️' : '💔');
    }

    // ============================================================
    //  简介展开
    // ============================================================
    function toggleSynopsis() {
      synopsisExpanded = !synopsisExpanded;
      const el = document.getElementById('synopsisText');
      el.classList.toggle('expanded', synopsisExpanded);
      document.getElementById('synopsisExpandBtn').textContent = synopsisExpanded ? '收起' : '展开全部';
    }

    // ============================================================
    //  选集渲染
    // ============================================================
    function renderEpisodeList() {
      const list = document.getElementById('episodeList');
      list.innerHTML = DRAMA_DATA.episodes.map(ep => {
        const isActive = ep.id === currentEp;
        return `<div class="ep-item${isActive ? ' active' : ''}" onclick="playEpisode(${ep.id})">${ep.id}</div>`;
      }).join('');
    }

    // ============================================================
    //  角色渲染
    // ============================================================
    function renderCast() {
      const grid = document.getElementById('castGrid');
      grid.innerHTML = DRAMA_DATA.cast.map(c => {
        const bound = c.bound && c.actor;
        // 有演员 → 显示演员头像；无演员 → 显示角色自己的动漫形象头像
        const avatarHtml = `<img src="${c.actorAvatar || c.characterAvatar}" alt="${c.name}" />`;
        const badgeHtml = bound
          ? `<div class="c-badge bound">✓</div>`
          : `<div class="c-badge unbound">⏳</div>`;
        // 演员名在上面（大字），角色名在下面（"饰" + 角色名）
        const actorLineHtml = bound
          ? `<div class="c-actor-line bound">${c.actor}</div>`
          : `<div class="c-actor-line unbound">待定演员</div>`;
        const onClick = bound
          ? `location.href='actor-profile.html?name=${encodeURIComponent(c.actor)}'`
          : undefined; // 不可点击
        return `
          <div class="cast-card${bound ? '' : ' unbound'}"${onClick ? ` onclick="${onClick}"` : ''}>
            <div class="c-avatar-wrap">
              <div class="c-avatar">${avatarHtml}</div>
              ${badgeHtml}
            </div>
            ${actorLineHtml}
            <div class="c-name">${bound ? `<span class="c-role-suffix">饰 </span>` : ''}${c.name}</div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    //  评论
    // ============================================================
    // 每条评论的点赞状态
    const commentLiked = {};

    function toggleCommentLike(commentId, btn) {
      const liked = !commentLiked[commentId];
      commentLiked[commentId] = liked;
      btn.classList.toggle('active', liked);
      const numEl = btn.querySelector('.c-like-num');
      let val = parseInt(numEl.textContent);
      numEl.textContent = liked ? val + 1 : val - 1;
      showToast(liked ? '❤️ 已点赞' : '💔 已取消点赞', liked ? '❤️' : '💔');
    }

    function renderComments() {
      const list = document.getElementById('commentList');
      list.innerHTML = DRAMA_DATA.comments.map(c => `
        <div class="comment-item">
          <div class="c-avatar">${c.avatar}</div>
          <div class="c-body">
            <div class="c-name">${c.name}</div>
            <div class="c-text">${c.text}</div>
            <div class="c-time">${c.time}</div>
          </div>
          <div class="c-actions">
            <button onclick="toggleCommentLike(${c.id}, this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
              <span class="c-like-num">${c.likes}</span>
            </button>
          </div>
        </div>
      `).join('');
      document.getElementById('commentCount').textContent = `(${DRAMA_DATA.comments.length})`;
    }

    function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) { showToast('请输入评论内容', '✏️'); return; }
      if (text.length > 200) { showToast('评论不能超过200字', '⚠️'); return; }

      DRAMA_DATA.comments.unshift({
        id: Date.now(),
        name: '我',
        avatar: '我',
        text: text,
        time: '刚刚',
        likes: 0,
      });
      input.value = '';
      renderComments();
      showToast('✅ 评论已发布', '✅');
    }

    // ============================================================
    //  初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      renderEpisodeList();
      renderCast();
      renderComments();
    });
  </script>
  <div id="bottom-nav-placeholder"></div>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
