<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的角色素材 · DreamOS</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --amber: #FFAA00; --teal: #00B8B8;
  --ink-900: #0D1017; --ink-800: #141820; --ink-700: #1C2230;
  --t1: #F0F3F8; --t2: #8899B2; --t3: #5E6E88;
  --b: rgba(255,255,255,.1); --bs: rgba(255,255,255,.06)
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100% }
body {
  font-family: "DM Mono", monospace;
  background: var(--ink-900);
  color: var(--t1);
  display: flex;
  flex-direction: column;
}

/* Topbar (matching DreamOS style) */
.topbar {
  height: 48px;
  background: var(--ink-800);
  border-bottom: 1px solid var(--b);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  flex-shrink: 0;
}
.tb-left { display: flex; align-items: center; gap: 12px }
.back-btn {
  font-size: 11px; color: var(--t3); cursor: pointer;
  background: none; border: none; font-family: "DM Mono", monospace;
  padding: 0; transition: color .15s;
  display: flex; align-items: center; gap: 6px;
}
.back-btn:hover { color: var(--amber) }
.tb-title {
  font-family: "EB Garamond", serif;
  font-style: italic; font-size: 18px; color: var(--t1)
}
.tb-count {
  font-size: 10px; color: var(--t3);
  background: rgba(255,255,255,.05);
  border: 1px solid var(--bs);
  padding: 2px 10px; border-radius: 99px;
}

/* Body */
.body {
  flex: 1; overflow-y: auto;
  padding: 48px 32px 80px;
  max-width: 960px; margin: 0 auto; width: 100%;
}

/* Section header */
.sec-ey {
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--amber); margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.sec-ey::before {
  content: ""; display: block; width: 28px; height: 1px;
  background: var(--amber)
}
.sec-name {
  font-family: "EB Garamond", serif;
  font-style: italic; font-size: 36px; color: var(--t1);
}
.sec-name-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 8px;
  gap: 16px;
}
.sec-create-btn {
  flex-shrink: 0;
  padding: 7px 18px;
  border-radius: 7px;
  background: var(--amber);
  color: var(--ink-900);
  border: none;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: opacity .15s;
  white-space: nowrap;
}
.sec-create-btn:hover { opacity: .85 }
.sec-sub {
  font-size: 12px; color: var(--t2); line-height: 1.6;
  margin-bottom: 24px;
}
.sec-div { border: none; border-top: 1px solid var(--b); margin-bottom: 36px }

/* Actor IP Card Grid */
.actor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.actor-card {
  background: var(--ink-800);
  border: 1px solid var(--b);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color .2s, background .2s;
  position: relative;
}
.actor-card:hover {
  border-color: rgba(255,170,0,.3);
  background: var(--ink-700);
}

.actor-card-avatar {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--ink-700);
  position: relative;
}
.actor-card-avatar img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}

.actor-card-body {
  padding: 16px 18px 18px;
}

.actor-card-name {
  font-family: "EB Garamond", serif;
  font-size: 20px;
  color: var(--t1);
  margin-bottom: 6px;
}

.actor-card-desc {
  font-size: 11px;
  color: var(--t2);
  line-height: 1.6;
  margin-bottom: 0;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 20px;
  opacity: .5;
}
.empty-title {
  font-family: "EB Garamond", serif;
  font-style: italic;
  font-size: 24px;
  color: var(--t2);
  margin-bottom: 10px;
}
.empty-desc {
  font-size: 12px;
  color: var(--t3);
  line-height: 1.7;
  margin-bottom: 24px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.empty-btn {
  display: inline-flex;
  align-items: center; gap: 8px;
  padding: 10px 24px;
  border-radius: 7px;
  background: var(--amber);
  color: var(--ink-900);
  border: none;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: opacity .15s;
}
.empty-btn:hover { opacity: .85 }

/* Login prompt */
.login-prompt {
  text-align: center;
  padding: 100px 20px;
}
.login-prompt .prompt-icon { font-size: 40px; margin-bottom: 16px }
.login-prompt .prompt-title {
  font-family: "EB Garamond", serif;
  font-style: italic;
  font-size: 28px;
  color: var(--t2);
  margin-bottom: 10px;
}
.login-prompt .prompt-desc {
  font-size: 12px;
  color: var(--t3);
  margin-bottom: 24px;
}
.login-prompt .prompt-btn {
  padding: 10px 28px;
  border-radius: 7px;
  background: var(--amber);
  color: var(--ink-900);
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: opacity .15s;
}
.login-prompt .prompt-btn:hover { opacity: .85 }

/* ═══ Modal ═══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: var(--ink-800);
  border: 1px solid var(--b);
  border-radius: 16px;
  width: 100%;
  max-width: 500px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
  transform: translateY(12px) scale(.97);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
.modal-overlay.active .modal-card {
  transform: translateY(0) scale(1);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  flex-shrink: 0;
}
.modal-header h2 {
  font-family: "EB Garamond", serif;
  font-style: italic;
  font-size: 22px;
  color: var(--t1);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--bs);
  background: transparent;
  color: var(--t3);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s, color .2s;
  font-family: "DM Mono", monospace;
}
.modal-close:hover {
  background: rgba(255,255,255,.08);
  color: var(--t1);
}

.modal-body {
  padding: 0 24px;
  overflow-y: auto;
  flex: 1;
}

/* Contract address row */
.modal-contract-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--ink-900);
  border-radius: 10px;
  border: 1px solid var(--bs);
  margin-bottom: 20px;
}
.modal-contract-label {
  font-size: 10px;
  color: var(--t3);
  white-space: nowrap;
  flex-shrink: 0;
}
.modal-contract-addr {
  font-size: 11px;
  color: var(--teal);
  font-family: "DM Mono", monospace;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.modal-copy-btn {
  flex-shrink: 0;
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--bs);
  background: transparent;
  color: var(--t3);
  font-size: 10px;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: all .2s;
}
.modal-copy-btn:hover {
  background: var(--amber);
  color: var(--ink-900);
  border-color: var(--amber);
}
.modal-copy-btn.copied {
  background: var(--teal);
  color: var(--ink-900);
  border-color: var(--teal);
}

/* Clone list section */
.modal-clone-section {
  margin-bottom: 20px;
}
.modal-clone-label {
  font-size: 11px;
  color: var(--t2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-clone-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.modal-clone-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--ink-900);
  border-radius: 8px;
  border: 1px solid var(--bs);
}
.modal-clone-id {
  font-size: 12px;
  color: var(--t1);
  font-family: "DM Mono", monospace;
  font-weight: 500;
}
.modal-clone-status {
  font-size: 10px;
  color: var(--t3);
}
.modal-clone-load-more {
  display: block;
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px dashed var(--bs);
  background: transparent;
  color: var(--t3);
  font-size: 11px;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: all .2s;
  text-align: center;
}
.modal-clone-load-more:hover {
  border-color: var(--amber);
  color: var(--amber);
}

/* Modal footer (info modal only) */
.modal-footer {
  padding: 16px 24px 20px;
  flex-shrink: 0;
  display: flex;
  gap: 10px;
}
.modal-btn-primary {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: 8px;
  background: var(--amber);
  color: var(--ink-900);
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: "DM Mono", monospace;
  transition: opacity .15s;
  text-decoration: none;
}
.modal-btn-primary:hover { opacity: .85 }

/* Toast */
.toast {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  z-index: 99999;
  background: rgba(13,16,23,.95);
  backdrop-filter: blur(12px);
  color: var(--t1);
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 12px;
  border: 1px solid var(--b);
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  opacity: 0; pointer-events: none;
  max-width: 420px; text-align: center;
  font-family: "DM Mono", monospace;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1 }

/* Responsive */
@media (max-width: 640px) {
  .body { padding: 24px 16px 60px }
  .actor-grid { grid-template-columns: 1fr }
  .sec-name { font-size: 28px }
  .modal-card { max-width: 100%; max-height: 90vh; border-radius: 12px; margin: 12px }
}
</style>
</head>

<script>

// ══════════════════════════════════════════════
//  Modal State

let _modalActorName = null;
let _modalAllClones = [];
let _modalPageSize = 8;
let _modalCurrentPage = 0;

// ══════════════════════════════════════════════
//  Render Logic
// ══════════════════════════════════════════════

function renderPage() {
  const body = document.getElementById('page-body');

  // ── Not logged in ──
  if (!currentUser || !currentUser.isLoggedIn) {
    body.innerHTML =
      '<div class="login-prompt">' +
      '  <div class="prompt-icon">🎭</div>' +
      '  <div class="prompt-title">登录后查看持有的角色素材</div>' +
      '  <div class="prompt-desc">请先登录 DreamOS / Story.fun 账户，查看你拥有的角色素材。</div>' +
      '  <button class="prompt-btn" onclick="goLogin()">去登录 →</button>' +
      '</div>';
    document.getElementById('nft-count').textContent = '未登录';
    return;
  }

  const heldNames = currentUser.actorNfts || [];

  const ipMap = {};
  for (var i = 0; i < heldNames.length; i++) {
    var name = heldNames[i];
    if (!ACTOR_IP_DB[name]) continue;
    if (!ipMap[name]) {
      ipMap[name] = { info: ACTOR_IP_DB[name], indices: [] };
    }
    ipMap[name].indices.push(i);
  }

  var ipNames = Object.keys(ipMap);
  document.getElementById('nft-count').textContent = ipNames.length + ' 个素材';

  // ── Empty state ──
  if (ipNames.length === 0) {
    body.innerHTML =
      '<div class="empty-state">' +
      '  <div class="empty-icon">🎭</div>' +
      '  <div class="empty-title">还没有持有角色素材</div>' +
      '  <div class="empty-desc">前往 Story.fun 市场 Mint 或购买角色素材，即可在这里查看你持有的角色素材。</div>' +
      '  <button class="empty-btn" onclick="openCreateModal()">+ 创建角色素材</button>' +
      '</div>';
    return;
  }

  // ── Render cards (one per IP) ──
  var html = '';
  html += '<div class="sec-name-row">';
  html += '  <div class="sec-name">我的角色素材</div>';
  html += '  <button class="sec-create-btn" onclick="openCreateModal()">+ 创建角色素材</button>';
  html += '</div>';
  html += '<div class="sec-sub">持有角色素材即可使用该形象参演短剧。</div>';
  html += '<hr class="sec-div">';
  html += '<div class="actor-grid">';

  for (var k = 0; k < ipNames.length; k++) {
    var actorName = ipNames[k];
    var ipData = ipMap[actorName];
    var actor = ipData.info;

    html += '<div class="actor-card">';
    html += '  <div class="actor-card-avatar">';
    html += '    <img src="' + actor.image + '" alt="' + actor.name + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;opacity:.15>🎭</div>\'">';
    
    html += '  </div>';
    html += '  <div class="actor-card-body">';
    html += '    <div class="actor-card-name">' + actor.name + '</div>';
    html += '    <div class="actor-card-desc">' + actor.description + '</div>';
    html += '  </div>';
    html += '</div>';
  }

  html += '</div>';
  body.innerHTML = html;
}

// ══════════════════════════════════════════════
//  Modal: IP info
// ══════════════════════════════════════════════

function openModal(actorName) {
  var ipData = ACTOR_IP_DB[actorName];
  if (!ipData) return;

  _modalActorName = actorName;
  _modalCurrentPage = 0;

  var heldNames = (currentUser && currentUser.actorNfts) || [];
  var indices = [];
  for (var i = 0; i < heldNames.length; i++) {
    if (heldNames[i] === actorName) {
      indices.push(i);
    }
  }

  _modalAllClones = indices.map(function(idx) {
    var baseNum = Number(ipData.defaultNftId ? ipData.defaultNftId.replace(/[^0-9]/g, '') : '0');
    var suffix = String(baseNum + idx).padStart(4, '0');
    return '#' + suffix;
  });

  document.getElementById('modalActorTitle').textContent = '🎭 ' + actorName;
  document.getElementById('modalContractAddr').textContent = ipData.contractAddress || '—';
  document.getElementById('modalCopyBtn').textContent = '复制';
  document.getElementById('modalCopyBtn').className = 'modal-copy-btn';

  _modalCurrentPage = 0;
  renderClonePage();

  document.getElementById('actorModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('actorModal').classList.remove('active');
  document.body.style.overflow = '';
  _modalActorName = null;
  _modalAllClones = [];
  _modalCurrentPage = 0;
}

function renderClonePage() {
  var listEl = document.getElementById('modalCloneList');
  var loadMoreEl = document.getElementById('modalLoadMore');

  if (_modalCurrentPage === 0) {
    listEl.innerHTML = '';
  }

  var startIdx = _modalCurrentPage === 0 ? 0 : listEl.querySelectorAll('.modal-clone-item').length;
  var endIdx = Math.min(startIdx + _modalPageSize, _modalAllClones.length);
  var pageItems = _modalAllClones.slice(startIdx, endIdx);

  var pageHtml = '';
  for (var i = 0; i < pageItems.length; i++) {
    pageHtml += '<div class="modal-clone-item">';
    pageHtml += '  <span class="modal-clone-id">' + pageItems[i] + '</span>';
    pageHtml += '  <span class="modal-clone-status">素材</span>';
    pageHtml += '</div>';
  }

  if (_modalCurrentPage === 0) {
    listEl.innerHTML = pageHtml;
  } else {
    listEl.insertAdjacentHTML('beforeend', pageHtml);
  }

  var renderedCount = listEl.querySelectorAll('.modal-clone-item').length;
  if (renderedCount < _modalAllClones.length) {
    loadMoreEl.style.display = 'block';
    loadMoreEl.textContent = '加载更多 (' + renderedCount + ' / ' + _modalAllClones.length + ') ↓';
  } else {
    loadMoreEl.style.display = 'none';
  }

  _modalCurrentPage++;
}

function loadMoreClones() {
  renderClonePage();
}

function copyContract() {
  var addr = document.getElementById('modalContractAddr').textContent;
  if (!addr || addr === '—') return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(addr).then(function() {
      var btn = document.getElementById('modalCopyBtn');
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
    }).catch(function() { fallbackCopy(addr); });
  } else {
    fallbackCopy(addr);
  }
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    var btn = document.getElementById('modalCopyBtn');
    btn.textContent = '已复制'; btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
  } catch (e) { showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

// Close actorModal on overlay click
document.addEventListener('click', function(e) {
  var overlay = document.getElementById('actorModal');
  if (e.target === overlay) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); }
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show') }, 2500);
}

//  Init
// ══════════════════════════════════════════════

function seedTestData() {
  if (!currentUser || !currentUser.isLoggedIn) return;
  if (!currentUser.actorNfts) currentUser.actorNfts = [];
  var hasLuna = currentUser.actorNfts.indexOf('Luna') !== -1;
  if (!hasLuna) return;
  var lunaCount = 0;
  for (var i = 0; i < currentUser.actorNfts.length; i++) {
    if (currentUser.actorNfts[i] === 'Luna') lunaCount++;
  }
  if (lunaCount < 20) {
    var need = 20 - lunaCount;
    for (var j = 0; j < need; j++) {
      currentUser.actorNfts.push('Luna');
    }
  }
}

document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    seedTestData();
    renderPage();
  }, 100);
});

document.addEventListener('auth-ready', function() {
  seedTestData();
  renderPage();
});

window.__debug = {
  currentUser: function() { return currentUser },
  addNft: function(name) {
    if (!currentUser.actorNfts) currentUser.actorNfts = [];
    if (currentUser.actorNfts.indexOf(name) === -1) {
      currentUser.actorNfts.push(name);
      renderPage();
      showToast('✅ 已添加 ' + name + ' 到持有列表（调试）');
    } else {
      showToast('⚠️ 已持有该素材');
    }
  },
  removeNft: function(name) {
    if (!currentUser.actorNfts) return;
    var idx = currentUser.actorNfts.indexOf(name);
    if (idx !== -1) {
      currentUser.actorNfts.splice(idx, 1);
      renderPage();
      showToast('已移除 ' + name + '（调试）');
    }
  },
  openModal: function(name) { openModal(name) },
  closeModal: function() { closeModal() }
};
