<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 邀请返佣</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.10);
      --text: #13202e;
      --text-secondary: #5e6f83;
      --text-tertiary: #8b8d98;
      --border: #deeaf7;
      --border-light: #e8f0fa;
      --shadow-sm: 0 2px 8px rgba(27, 45, 71, 0.04);
      --shadow-md: 0 8px 24px rgba(27, 45, 71, 0.06);
      --radius: 16px;
      --radius-sm: 10px;
      --story-green: #05DF72;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
    @media (max-width: 640px) { .app-shell { padding: 16px; } }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      margin-bottom: 32px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    @media (max-width: 640px) { .metrics-grid { grid-template-columns: 1fr; } }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
    }
    .metric-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    .metric-value {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .metric-value.green { color: var(--story-green); }
    .metric-value.blue  { color: #3b82f6; }
    .metric-value.gold  { color: #f5b042; }
    .metric-sub {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* ===== Invite Link Card ===== */
    .invite-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }
    .invite-card h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .invite-card .sub {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-bottom: 20px;
    }
    .invite-link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 4px 4px 16px;
      margin-bottom: 16px;
    }
    .invite-link-row .link-text {
      flex: 1;
      font-size: 0.88rem;
      color: var(--text);
      font-family: "SF Mono", monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: all;
    }
    .invite-link-row .copy-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .invite-link-row .copy-btn:hover {
      opacity: 0.85;
    }
    .invite-link-row .copy-btn:active {
      transform: scale(0.97);
    }
    .invite-actions {
      display: flex;
      gap: 12px;
    }
    .invite-actions .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .invite-actions .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .invite-actions .btn-primary:hover {
      box-shadow: 0 4px 16px rgba(0,179,136,0.25);
      transform: translateY(-1px);
    }
    .invite-actions .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .invite-actions .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .invite-qr-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
      padding: 16px 20px;
      background: var(--bg);
      border-radius: 12px;
    }
    .invite-qr-code {
      width: 88px;
      height: 88px;
      border-radius: 10px;
      background: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .invite-qr-code img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .invite-qr-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ===== Section ===== */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-header h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* ===== Table ===== */
    .table-wrap { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 10px 12px; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    .data-table th {
      color: var(--text-secondary);
      font-weight: 500;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }
    .data-table td {
      border-bottom: 1px solid var(--border-light);
    }
    .data-table tr:last-of-type td { border-bottom: none; }
    .address-tag { font-family: monospace; color: var(--text-secondary); font-size: 0.8rem; }

    /* ===== View All ===== */
    .view-all-wrap { text-align: center; padding: 12px 0 4px; }
    .view-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .view-all-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .view-all-arrow { display: inline-block; transition: transform 0.2s ease; }
    .view-all-btn:hover .view-all-arrow { transform: translateX(3px); }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-sheet {
      background: var(--surface);
      border-radius: 22px 22px 0 0;
      width: 100%; max-width: 800px; max-height: 80vh;
      display: flex; flex-direction: column;
      transform: translateY(30px);
      transition: transform 0.35s ease;
      box-shadow: 0 -8px 40px rgba(27,45,71,0.12);
      overflow: hidden;
    }
    .modal-overlay.active .modal-sheet { transform: translateY(0); }
    .modal-sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .modal-sheet-header h3 { margin: 0; font-size: 1rem; font-weight: 600; }
    .modal-sheet-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.03); cursor: pointer;
      display: grid; place-items: center;
      font-size: 1.1rem; color: var(--text-tertiary);
      transition: all 0.15s;
    }
    .modal-sheet-close:hover { background: rgba(0,0,0,0.06); color: var(--text); }
    .modal-sheet-body {
      flex: 1; overflow-y: auto; padding: 0 24px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .modal-sheet-body .data-table th {
      position: sticky; top: 0; background: var(--surface); z-index: 1;
    }

    /* ===== Rules ===== */
    .rule-simple {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px 24px;
    }
    .rule-simple .icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: var(--accent-soft);
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .rule-simple .content {
      flex: 1;
    }
    .rule-simple .content .title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .rule-simple .content .desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .rule-simple .content .highlight {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.1rem;
    }


    /* ===== Toast ===== */
    .toast-notification {
      position: fixed; top: 24px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9999;
      background: rgba(26,35,47,0.95);
      backdrop-filter: blur(8px);
      color: #fff; padding: 14px 24px; border-radius: 14px;
      font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(27,45,71,0.25);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0; pointer-events: none;
      max-width: 400px; text-align: center; font-weight: 500;
    }
    .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-shell">

    <!-- ===== Page Header ===== -->
    <div class="page-header">
      <h1>邀请返佣</h1>
    </div>

    <!-- ===== Metrics ===== -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">累计邀请人数</div>
        <div class="metric-value blue" id="mInviteCount">8</div>
        <div class="metric-sub">已注册用户</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">累计返佣</div>
        <div class="metric-value green" id="mTotalCommission">$56.40</div>
        <div class="metric-sub">历史返佣总和</div>
      </div>
      <div class="metric-card" style="cursor:pointer;" onclick="goToRewards()">
        <div class="metric-label">可领取返佣</div>
        <div class="metric-value gold" id="mPendingCommission">$12.80</div>
        <div class="metric-sub" style="color:var(--accent);">前往收益页面领取 →</div>
      </div>

    </div>

    <!-- ===== Invite Link ===== -->
    <div class="invite-card">
      <h2>邀请好友，一起赚</h2>
      <p class="sub">将链接分享给好友，好友注册并完成任意 AI 出演后，你将获得返佣奖励</p>
      <div class="invite-link-row">
        <span class="link-text" id="inviteLink">https://story.fun/invite/7A2b3fD8</span>
        <button class="copy-btn" onclick="copyInviteLink()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制链接
        </button>
      </div>
      <div class="invite-actions">
        <button class="btn btn-primary" onclick="shareInvite()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg>
          分享邀请链接
        </button>
        <button class="btn btn-outline" onclick="showToast('📋 邀请码已复制')">复制邀请码</button>
      </div>
      <div class="invite-qr-wrap">
        <div class="invite-qr-code" id="qrCode">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8b8d98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><path d="M3 14h3v4h3"/><path d="M7 17v-3"/><path d="M17 17h.01"/></svg>
        </div>
        <div class="invite-qr-text">
          <strong>扫码邀请</strong><br />
          好友扫码即可打开邀请页面，自动绑定邀请关系
        </div>
      </div>
    </div>

    <!-- ===== Referral Records ===== -->
    <div class="section-card" id="secReferral">
      <div class="section-header">
        <h3>返佣记录</h3>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>时间</th><th>被邀请人</th><th>返佣金额 (USDC)</th>
            </tr>
          </thead>

          <tbody id="referralPreview"></tbody>
        </table>
      </div>
      <div class="view-all-wrap">
        <button class="view-all-btn" onclick="openModal('referral')">
          查看全部 <span class="view-all-arrow">→</span>
        </button>
      </div>
    </div>

    <!-- ===== Rules ===== -->
    <div class="section-card">
      <div class="section-header">
        <h3>返佣规则</h3>
      </div>
      <div class="rule-simple">
        <div class="icon">🤝</div>
        <div class="content">
          <div class="title">好友消费，你拿返佣</div>
          <div class="desc">
            好友通过你的邀请链接注册后，在平台上每笔 USDC 消费，你将获得 <span class="highlight">5%</span> 的 USDC 返佣。返佣自动累计，前往 <strong>收益页面</strong> 领取。
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-sheet-header">
        <h3 id="modalTitle">返佣记录</h3>
        <button class="modal-sheet-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-sheet-body" id="modalBody">
        <div class="table-wrap">
          <table class="data-table">
            <thead id="modalTableHead"></thead>
            <tbody id="modalTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-notification" id="toastNotification">
    <span id="toastMessage"></span>
  </div>

  <script src="load-header.js"></script>
  <script src="auth.js"></script>
  <script>
    const PREVIEW_LIMIT = 3;

    // Generate mock referral data
    const addrs = ['0x1a2B...3c4D','0x5e6F...7g8H','0x9i0J...1k2L','0x3m4N...5o6P','0x7q8R...9s0T','0x2b3C...4d5E','0x6f7G...8h9I','0x0j1K...2l3M','0x4n5O...6p7Q','0x8r9S...0t1U'];
    const TX_REFERRAL = Array.from({length:18}, (_,i) => ({
      time:`06-${String(15-(i%12)).padStart(2,'0')} ${String(9+(i*3)%11).padStart(2,'0')}:${String(i*6%60).padStart(2,'0')}`,
      invitee:addrs[i%addrs.length],
      amount:+(2+i*0.6+Math.random()*3).toFixed(2)
    }));

    let toastTimer;

    function goToRewards() {
      window.location.href = 'rewards.html';
    }


    function showToast(msg) {
      const t=document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent=msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
    }

    function copyInviteLink() {
      const link = document.getElementById('inviteLink').textContent;
      navigator.clipboard.writeText(link).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = link; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      });
      showToast('✅ 邀请链接已复制');
    }

    function shareInvite() {
      const link = document.getElementById('inviteLink').textContent;
      if (navigator.share) {
        navigator.share({ title: 'Story.fun 邀请', text: '和我一起玩 Story.fun AI 短剧！', url: link })
          .catch(() => copyInviteLink());
      } else {
        copyInviteLink();
      }
    }

    // ===== Modal =====
    function openModal() {
      document.getElementById('modalTitle').textContent = '返佣记录';
      const thead = document.getElementById('modalTableHead');
      thead.innerHTML = '<tr><th>时间</th><th>被邀请人</th><th>返佣金额 (USDC)</th></tr>';
      document.getElementById('modalTableBody').innerHTML = TX_REFERRAL.map(rowReferral).join('');
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function rowReferral(tx) {
      return `<tr><td>${tx.time}</td><td><span class="address-tag">${tx.invitee}</span></td><td style="font-weight:600;color:var(--accent);">$${tx.amount.toFixed(2)}</td></tr>`;
    }

    function renderPreview() {
      const tbody = document.getElementById('referralPreview');
      const slice = TX_REFERRAL.slice(0, PREVIEW_LIMIT);
      tbody.innerHTML = slice.length
        ? slice.map(rowReferral).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text-tertiary);padding:24px;">暂无邀请记录</td></tr>';
    }


    document.addEventListener('DOMContentLoaded', function() {
      renderPreview();
    });
  </script>
  <div id="bottom-nav-placeholder"></div>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
