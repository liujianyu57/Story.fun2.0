function getQueryParam(name) {

function generateUserData(week) {
  const users = [];
  const baseUid = week * 1000;
  const count = 12 + (week % 5) * 3;
  const nameParts = ['子轩','雨涵','浩宇','雪琪','明哲','思涵','天佑','诗涵','宇轩','若曦',
    '子涵','晨曦','俊杰','语嫣','梓豪','芷柔','一鸣','佳琪','文博','静怡',
    '鹏飞','梦洁','志远','婉婷','泽宇','芸熙','翰林','瑾瑜','睿渊','雅静'];
  for (let i = 0; i < count; i++) {
    const nominal = +(50 + Math.random() * 500).toFixed(2);
    const actual = weekStatuses[week] === 'approved' ? nominal : +(nominal * (0.3 + Math.random() * 0.7)).toFixed(2);
    users.push({ uid: baseUid + i + 1, name: nameParts[i % nameParts.length], nominal, actual });
  }
  return users;
}

  if (n >= 1000000000) return (n/1000000000).toFixed(2)+'B';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  return n.toLocaleString();
}

function showToast(msg) {
  const t = document.getElementById('toastNotification');
  document.getElementById('toastMessage').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function updateHistoryBadge() {
  const badge = document.getElementById('historyBadge');
  if (!badge) return;
  const count = modificationHistory.length;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

function openHistoryModal() {
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  if (modificationHistory.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.innerHTML = modificationHistory.slice().reverse().map((r, i) => {
      const idx = modificationHistory.length - i;
      return `<div style="padding:12px 0;border-bottom:1px solid var(--border-light);display:flex;gap:10px;align-items:flex-start;">
        <span style="background:var(--accent-soft);color:var(--accent);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;">${idx}</span>
        <div style="flex:1;">
          <div style="font-size:0.82rem;font-weight:600;">UID-${r.uid} · ${r.userName}</div>
          <div style="font-size:0.78rem;color:var(--text-secondary);margin:4px 0;">
            <span style="color:var(--text-tertiary);">${r.oldActual.toFixed(2)}</span>
            <span style="color:var(--text-tertiary);margin:0 4px;">→</span>
            <span style="color:var(--accent);font-weight:600;">${r.newActual.toFixed(2)}</span>
          </div>
          ${r.remark ? `<div style="font-size:0.78rem;color:var(--text-tertiary);">备注：${r.remark}</div>` : ''}
          <div style="font-size:0.7rem;color:var(--text-tertiary);margin-top:2px;">${r.time}</div>
        </div>
      </div>`;
    }).join('');
  }
  openModal('historyModal');
}

function renderPage() {
  const info = weekInfoMap[currentWeek] || {range:'未知',users:0,amount:0};
  const status = weekStatuses[currentWeek] || 'pending';
  const statusLabel = status === 'pending' ? '结算中' : '已放行';
  const statusClass = status === 'pending' ? 'pending' : 'approved';
  document.getElementById('pageTitle').textContent = `${info.range}`;
  document.getElementById('mTotalUsers').textContent = userData.length;
  const totalNominal = userData.reduce((s,u) => s + u.nominal, 0);
  const totalActual = userData.reduce((s,u) => s + u.actual, 0);
  document.getElementById('mTotalNominal').textContent = fmt(totalNominal);
  document.getElementById('mTotalActual').textContent = fmt(totalActual);
  document.getElementById('mWeekStatus').innerHTML = `<span class="status-tag ${statusClass}">${statusLabel}</span>`;
  renderUserTable();
}

function renderUserTable() {
  const status = weekStatuses[currentWeek] || 'pending';
  const isPending = status === 'pending';
  const tbody = document.getElementById('userBody');
  const paginationEl = document.getElementById('userPagination');
  const keyword = uidSearchKeyword.trim();
  const filtered = keyword ? userData.filter(u => String(u.uid).includes(keyword)) : userData;
  filtered.sort((a, b) => b.actual - a.actual);
  const totalFiltered = filtered.length;
  document.getElementById('userCountLabel').textContent = keyword ? `筛选 ${totalFiltered} / 共 ${userData.length} 人` : `共 ${userData.length} 人`;
  const totalPages = Math.ceil(totalFiltered / USER_PAGE_SIZE) || 1;
  if (userPage > totalPages) userPage = totalPages;
  const start = (userPage - 1) * USER_PAGE_SIZE;
  const pageData = filtered.slice(start, start + USER_PAGE_SIZE);
  if (pageData.length === 0) {
    tbody.innerHTML = keyword ? '<tr><td colspan="4" class="empty-state">未找到匹配的用户</td></tr>' : '<tr><td colspan="4" class="empty-state">暂无用户数据</td></tr>';
    paginationEl.innerHTML = '';
    return;
  }
  tbody.innerHTML = pageData.map(u => `<tr>
    <td><strong>${u.uid}</strong><span style="color:var(--text-tertiary);font-size:0.78rem;margin-left:6px;">${u.name}</span></td>
    <td style="font-weight:600;">${u.nominal.toFixed(2)}</td>
    <td style="font-weight:600;${isPending ? 'color:var(--text);' : 'color:var(--accent);'}">${u.actual.toFixed(2)}</td>
    <td>${isPending ? `<button class="btn-sm-outline" onclick="openEditModal(${u.uid})">✏️ 编辑</button>` : `<span style="color:var(--text-tertiary);font-size:0.78rem;">—</span>`}</td>
  </tr>`).join('');
  renderUserPagination(totalPages);
}

function renderUserPagination(totalPages) {
  const el = document.getElementById('userPagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${userPage <= 1 ? 'disabled' : ''} onclick="changeUserPage(${userPage - 1})">← 上一页</button>
    <span class="page-info">第 ${userPage} / ${totalPages} 页</span>
    <button ${userPage >= totalPages ? 'disabled' : ''} onclick="changeUserPage(${userPage + 1})">下一页 →</button>`;
}

function changeUserPage(page) {
  userPage = page;
  renderUserTable();
}

let editingUid = null;

function openEditModal(uid) {
  const u = userData.find(d => d.uid === uid);
  if (!u) return;
  editingUid = uid;
  document.getElementById('editUserLabel').textContent = `UID-${uid} · ${u.name}`;
  document.getElementById('editNominalDisplay').value = u.nominal.toFixed(2);
  document.getElementById('editActualInput').value = u.actual;
  document.getElementById('editRemarkInput').value = '';
  openModal('editModal');
}

function confirmEdit() {
  const input = document.getElementById('editActualInput');
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) { showToast('请输入有效的金额（最小为 0）'); return; }
  const u = userData.find(d => d.uid === editingUid);
  if (!u) return;
  const oldVal = u.actual;
  u.actual = +val.toFixed(2);

  const remark = document.getElementById('editRemarkInput').value.trim();
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', {hour12:false});
  modificationHistory.push({ uid: u.uid, userName: u.name, oldActual: oldVal, newActual: u.actual, remark, time: timeStr });
  updateHistoryBadge();

  closeModal('editModal');
  renderPage();
  showToast(`✅ 已更新 UID-${editingUid} 实际产出为 ${u.actual.toFixed(2)} STORY`);
  editingUid = null;
}

function updateActual(uid, value) {
  const val = parseFloat(value);
  if (isNaN(val) || val < 0) return;
  const u = userData.find(d => d.uid === uid);
  if (!u) return;
  u.actual = +val.toFixed(2);
  document.getElementById('mTotalActual').textContent = fmt(userData.reduce((s,u) => s + u.actual, 0));
}

function openBatchEditModal() {
  const status = weekStatuses[currentWeek] || 'pending';
  if (status !== 'pending') { showToast('该周期已放行，不可修改'); return; }
  document.getElementById('batchActualInput').value = '';
  openModal('batchEditModal');
}

function confirmBatchEdit() {
  const input = document.getElementById('batchActualInput');
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) { showToast('请输入有效的金额（最小为 0）'); return; }
  const rounded = +val.toFixed(2);
  const now = new Date();
  const timeStr = now.toLocaleString('zh-CN', {hour12:false});

  userData.forEach(u => {
    if (u.actual !== rounded) {
      modificationHistory.push({ uid: u.uid, userName: u.name, oldActual: u.actual, newActual: rounded, remark: '批量修改', time: timeStr });
    }
    u.actual = rounded;
  });
  updateHistoryBadge();

  closeModal('batchEditModal');
  renderPage();
  showToast(`✅ 已将所有用户实际产出统一设为 ${rounded} STORY`);
}

document.addEventListener('DOMContentLoaded', function() {
  const weekParam = getQueryParam('week');
  currentWeek = weekParam ? parseInt(weekParam) : 22;
  if (!weekInfoMap[currentWeek]) currentWeek = 22;
  userData = generateUserData(currentWeek);
  renderPage();
  const searchInput = document.getElementById('uidSearchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      uidSearchKeyword = e.target.value;
      renderUserTable();
    });
  }
});
</script>
</body>
</html>
