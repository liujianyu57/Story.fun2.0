<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 周期收益明细</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.10);
      --text: #13202e;
      --text-secondary: #5e6f83;
      --text-tertiary: #8b8d98;
      --border: #deeaf7;
      --border-light: #e8f0fa;
      --shadow-sm: 0 2px 8px rgba(27, 45, 71, 0.04);
      --radius: 16px;
      --radius-sm: 10px;
      --danger: #f45b69;
      --warning: #ff9f2c;
      --gold: #f5b042;
      --story-green: #05DF72;
      --story-teal: #00BBA7;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
    @media (max-width: 640px) { .app-shell { padding: 16px; } }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 28px; margin-bottom: 24px;
    }
    .page-header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.015em; }
    .page-header-actions { display: flex; gap: 12px; align-items: center; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-secondary); font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; text-decoration: none;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .metrics-group { margin-bottom: 20px; }
    .metrics-group-grid { display: grid; gap: 16px; }
    .metrics-group-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .metrics-group-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 720px) { .metrics-group-grid.cols-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .metrics-group-grid.cols-2, .metrics-group-grid.cols-3 { grid-template-columns: 1fr; } }
    .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow-sm); }
    .metric-label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
    .metric-value { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .metric-value.green { color: var(--story-green); }
    .metric-value.gold { color: var(--gold); }
    .metric-value.teal { color: var(--story-teal); }
    .metric-value.danger { color: var(--danger); }
    .metric-sub { font-size: 0.78rem; color: var(--text-tertiary); margin-top: 4px; }

    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .section-header h3 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    .section-header .hint { font-size: 0.78rem; color: var(--text-tertiary); font-weight: 400; }

    .control-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .search-input {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 999px;
      font-size: 0.85rem; font-family: inherit; background: var(--surface);
      color: var(--text); outline: none; width: 200px; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-tertiary); }

    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-light); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 12px 14px; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    .data-table th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border-light); font-size: 0.78rem; letter-spacing: 0.02em; background: #f8fbfe; }
    .data-table td { border-bottom: 1px solid var(--border-light); }
    .data-table tr:last-of-type td { border-bottom: none; }
    .data-table tr:hover td { background: #f8fbfe; }

    .badge-hist { position: relative; display: inline-flex; align-items: center; gap: 4px; }
    .badge-hist .ball {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 0.65rem; font-weight: 700;
      cursor: pointer; transition: transform 0.15s;
    }
    .badge-hist .ball:hover { transform: scale(1.18); }
    .badge-hist .count { font-size: 0.75rem; color: var(--text-tertiary); }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 24px; border-radius: 999px; border: none;
      background: var(--accent); color: #fff; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,179,136,0.25); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 24px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease; text-decoration: none;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm-outline {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; text-decoration: none;
    }
    .btn-sm-outline:hover { border-color: var(--accent); color: var(--accent); }

    .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 16px; }
    .pagination button {
      padding: 6px 16px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--text-secondary); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .pagination button:hover { border-color: var(--accent); color: var(--accent); }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination .page-info { font-size: 0.82rem; color: var(--text-tertiary); }

    .status-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status-tag.normal { background: rgba(0, 179, 136, 0.10); color: var(--accent); }
    .status-tag.boosted { background: rgba(245, 176, 66, 0.15); color: #c2891f; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 5000;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(27,45,71,0.2);
      width: 90%; max-width: 460px; max-height: 80vh; overflow-y: auto;
      padding: 28px 32px;
    }
    .modal-box.wide { max-width: 640px; }
    .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-box .modal-header h3 { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .modal-box .modal-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: none; background: rgba(0,0,0,0.04); border-radius: 50%; cursor: pointer;
      font-size: 1.2rem; color: var(--text-secondary); transition: background 0.15s;
    }
    .modal-box .modal-close:hover { background: rgba(0,0,0,0.08); }
    .modal-box .modal-body { margin-bottom: 20px; }
    .modal-box .modal-body p { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
    .modal-box .modal-body label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .modal-box .modal-body input[type="number"], .modal-box .modal-body textarea {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 0.88rem; font-family: inherit; background: var(--surface); color: var(--text);
      outline: none; transition: border-color 0.15s; margin-bottom: 12px;
    }
    .modal-box .modal-body input[type="number"]:focus, .modal-box .modal-body textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-modal-cancel {
      padding: 10px 24px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-secondary); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-modal-cancel:hover { border-color: var(--text-secondary); }
    .btn-modal-confirm {
      padding: 10px 24px; border-radius: 999px; border: none;
      background: var(--accent); color: #fff; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-modal-confirm:hover { opacity: 0.85; }
    .btn-modal-confirm.danger { background: var(--danger); }
    .btn-modal-confirm:disabled { opacity: 0.4; cursor: default; }

    .history-list { max-height: 300px; overflow-y: auto; }
    .history-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 0.82rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .hi-left { display: flex; flex-direction: column; gap: 2px; }
    .history-item .hi-user { font-weight: 600; color: var(--text); }
    .history-item .hi-time { font-size: 0.72rem; color: var(--text-tertiary); }
    .history-item .hi-change { font-weight: 600; color: var(--accent); }
    .history-item .hi-remark { font-size: 0.75rem; color: var(--text-tertiary); }
    .empty-state { text-align: center; padding: 48px 0; color: var(--text-tertiary); font-size: 0.88rem; }

    .toast-notification {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px);
      z-index: 9999; background: rgba(26,35,47,0.95); backdrop-filter: blur(8px);
      color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(27,45,71,0.25);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0; pointer-events: none; max-width: 400px; text-align: center; font-weight: 500;
    }
    .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div id="admin-sidebar-placeholder"></div>

  <div class="app-shell">

    <div class="page-header">
      <h1 id="pageTitle">周期 #22 · 06/09 ~ 06/15</h1>
      <div class="page-header-actions">
        <a class="btn-back" href="admin-mining.html">← 返回列表</a>
        <button class="btn-outline" onclick="openHistoryModal()" id="historyBtn">📋 修改记录 <span class="badge-hist" id="historyBadge"><span class="ball" id="historyBall">0</span></span></button>
      </div>
    </div>

    <!-- 概览指标 -->
    <div class="metrics-group">
      <div class="metrics-group-grid cols-3">
        <div class="metric-card">
          <div class="metric-label">名义总产出</div>
          <div class="metric-value gold" id="mTotalNominal">--</div>
          <div class="metric-sub">按质押量计算的参考值</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">实际总产出</div>
          <div class="metric-value green" id="mTotalActual">--</div>
          <div class="metric-sub">可编辑，最终放行金额</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">参与用户数</div>
          <div class="metric-value" id="mTotalUsers">--</div>
          <div class="metric-sub">含 boost 用户</div>
        </div>
      </div>
    </div>

    <!-- 搜索 & 批量操作 -->
    <div class="control-bar">
      <input class="search-input" id="uidSearchInput" type="text" placeholder="搜索 UID 或用户名..." />
      <button class="btn-primary" id="batchEditBtn" onclick="openBatchEditModal()">✏️ 批量修改实际产出</button>
      <span class="hint" style="font-size:0.78rem;color:var(--text-tertiary);">提示：放行后不可再修改</span>
    </div>

    <!-- 用户列表 -->
    <div class="section-card">
      <div class="section-header">
        <h3>用户收益明细</h3>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:50px;">#</th>
              <th style="width:80px;">UID</th>
              <th style="min-width:80px;">用户名</th>
              <th style="width:110px;">质押量</th>
              <th style="width:110px;">权重</th>
              <th style="width:120px;">名义产出</th>
              <th style="width:120px;">实际产出</th>
              <th style="width:100px;">状态</th>
              <th style="width:100px;">操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- 由 JS 渲染 -->
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>编辑实际产出</h3>
        <button class="modal-close" onclick="closeModal('editModal')">✕</button>
      </div>
      <div class="modal-body">
        <p id="editUserLabel">UID-1001 · 苏婉清</p>
        <label>名义产出</label>
        <input type="number" id="editNominalDisplay" disabled style="background:#f6f8fa;opacity:0.7;" />
        <label>实际产出 (STORY)</label>
        <input type="number" id="editActualInput" step="0.01" min="0" />
        <label>备注（可选）</label>
        <textarea id="editRemarkInput" rows="2" placeholder="修改原因..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('editModal')">取消</button>
        <button class="btn-modal-confirm" onclick="confirmEdit()">确认修改</button>
      </div>
    </div>
  </div>

  <!-- 批量修改弹窗 -->
  <div class="modal-overlay" id="batchEditModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>批量修改实际产出</h3>
        <button class="modal-close" onclick="closeModal('batchEditModal')">✕</button>
      </div>
      <div class="modal-body">
        <p>将所有用户的「实际产出」设为统一金额。此操作不可撤销。</p>
        <label>统一实际产出 (STORY)</label>
        <input type="number" id="batchActualInput" step="0.01" min="0" placeholder="例如：152.35" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('batchEditModal')">取消</button>
        <button class="btn-modal-confirm danger" onclick="confirmBatchEdit()">确认批量修改</button>
      </div>
    </div>
  </div>

  <!-- 修改记录弹窗 -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-box wide">
      <div class="modal-header">
        <h3>修改记录</h3>
        <button class="modal-close" onclick="closeModal('historyModal')">✕</button>
      </div>
      <div class="modal-body">
        <div id="historyList" class="history-list">
          <!-- 由 JS 渲染 -->
        </div>
        <div id="historyEmpty" class="empty-state" style="display:none;">暂无修改记录</div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-notification" id="toastNotification">
    <span id="toastMessage"></span>
  </div>

  <script src="load-admin-sidebar.js"></script>
  <script>
    // ================================================================
    //  模拟数据
    // ================================================================

    const weekInfoMap = {
      22: { label:'第 22 期 · 06/09 ~ 06/15', status:'pending' },
      21: { label:'第 21 期 · 06/02 ~ 06/08', status:'approved' },
      20: { label:'第 20 期 · 05/26 ~ 06/01', status:'approved' },
      19: { label:'第 19 期 · 05/19 ~ 05/25', status:'approved' },
      18: { label:'第 18 期 · 05/12 ~ 05/18', status:'approved' },
      17: { label:'第 17 期 · 05/05 ~ 05/11', status:'pending' },
      16: { label:'第 16 期 · 04/28 ~ 05/04', status:'approved' },
      15: { label:'第 15 期 · 04/21 ~ 04/27', status:'approved' },
      14: { label:'第 14 期 · 04/14 ~ 04/20', status:'approved' },
      13: { label:'第 13 期 · 04/07 ~ 04/13', status:'pending' },
    };
    const weekStatuses = {};
    Object.keys(weekInfoMap).forEach(k => { weekStatuses[k] = weekInfoMap[k].status; });

    let currentWeek = 22;
    let userData = [];
    let currentPage = 1;
    const PAGE_SIZE = 15;
    let uidSearchKeyword = '';
    const modificationHistory = [];

    const ACTOR_POOL = [
      '苏婉清','林梦瑶','赵无极','Luna','沈千雪','陆北辰','苏晚晴','林雪儿','江辰','李云飞',
      '白羽','青鸾','火凤','墨渊','花无缺','剑心','云中君','镜湖','雪见','风清扬',
      '叶倾城','百里屠苏','南宫问天','东方月初','西门吹雪','上官婉儿','司徒静','独孤剑',
      '令狐冲','杨过','小龙女','韦小宝','乔峰','段誉','虚竹','郭靖','黄蓉','周芷若',
    ];

    function generateUserData(week) {
      const seed = week * 7;
      const count = 12 + (seed % 24);
      const baseStake = 5000 + (week * 110);
      return Array.from({ length: count }, (_, i) => {
        const uid = 1000 + i + (week * 37) % 100;
        const stake = baseStake + (i * 237) % 5000;
        const boost = (i === 1 || i === 5) ? 1.5 : (i === 7 ? 2.0 : 1.0);
        const nominal = +(stake / 10000 * (0.8 + (week * 0.005)) * (1 + (i % 4) * 0.03)).toFixed(2);
        const actual = +(nominal * (0.9 + (i % 3) * 0.05)).toFixed(2);
        const seedSum = (uid + week + i * 3) % 100;
        return {
          uid, name: ACTOR_POOL[i % ACTOR_POOL.length],
          stake: Math.round(stake), weight: boost,
          nominal, actual, status: seedSum < 15 ? 'boosted' : 'normal',
        };
      }).sort((a, b) => b.stake - a.stake);
    }

    function getQueryParam(key) {
      const m = new URLSearchParams(window.location.search);
      return m.get(key);
    }

    function fmt(n) {
      if (n >= 1000000000) return (n/1000000000).toFixed(2) + 'B';
      if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n/1000).toFixed(1) + 'k';
      return n.toLocaleString();
    }

    function showToast(msg) {
      const t = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function updateHistoryBadge() {
      const ball = document.getElementById('historyBall');
      if (ball) ball.textContent = modificationHistory.length;
    }

    function openHistoryModal() {
      const list = document.getElementById('historyList');
      const empty = document.getElementById('historyEmpty');
      if (modificationHistory.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        list.innerHTML = modificationHistory.slice().reverse().map(h =>
          '<div class="history-item">' +
            '<div class="hi-left">' +
              '<div class="hi-user">UID-' + h.uid + ' · ' + h.userName + '</div>' +
              '<div class="hi-time">' + h.time + '</div>' +
              '<div class="hi-remark">' + (h.remark || '') + '</div>' +
            '</div>' +
            '<div class="hi-change">' + h.oldActual.toFixed(2) + ' → ' + h.newActual.toFixed(2) + '</div>' +
          '</div>'
        ).join('');
      }
      openModal('historyModal');
    }

    function renderPage() {
      const info = weekInfoMap[currentWeek] || { label:`第 ${currentWeek} 期`, status:'pending' };
      document.getElementById('pageTitle').textContent = `周期 ${info.label}`;

      const isApproved = (weekStatuses[currentWeek] || 'pending') === 'approved';
      document.getElementById('batchEditBtn').disabled = isApproved;

      const totalNominal = userData.reduce((s, u) => s + u.nominal, 0);
      const totalActual = userData.reduce((s, u) => s + u.actual, 0);
      document.getElementById('mTotalNominal').textContent = fmt(totalNominal) + ' STORY';
      document.getElementById('mTotalActual').textContent = fmt(totalActual) + ' STORY';
      document.getElementById('mTotalUsers').textContent = userData.length;

      renderUserTable();
    }

    function renderUserTable() {
      const kw = uidSearchKeyword.trim().toLowerCase();
      const filtered = kw ? userData.filter(u => u.name.includes(kw) || String(u.uid).includes(kw)) : userData;
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageData = filtered.slice(start, start + PAGE_SIZE);
      const tbody = document.getElementById('userTableBody');
      const isApproved = (weekStatuses[currentWeek] || 'pending') === 'approved';

      tbody.innerHTML = pageData.map((u, idx) => {
        const rank = start + idx + 1;
        const statusLabel = u.status === 'boosted' ? 'Boost' : '正常';
        const editBtn = isApproved
          ? `<span style="color:var(--text-tertiary);font-size:0.75rem;font-weight:500;">已放行</span>`
          : `<button class="btn-sm-outline" onclick="openEditModal(${u.uid})">编辑</button>`;
        return `<tr>
          <td style="font-weight:600;">${rank}</td>
          <td style="color:var(--text-secondary);">${u.uid}</td>
          <td><strong>${u.name}</strong></td>
          <td>${u.stake.toLocaleString()}</td>
          <td>${u.weight === 1.0 ? '—' : '×' + u.weight.toFixed(1)}</td>
          <td style="color:var(--text-secondary);">${u.nominal.toFixed(2)}</td>
          <td style="font-weight:600;color:var(--accent);">${u.actual.toFixed(2)}</td>
          <td><span class="status-tag ${u.status}">${statusLabel}</span></td>
          <td>${editBtn}</td>
        </tr>`;
      }).join('');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">无匹配用户</div></td></tr>`;
      }

      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) { pagination.innerHTML = ''; return; }
      pagination.innerHTML = `
        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">← 上一页</button>
        <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
        <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一页 →</button>`;
    }

    function changePage(page) { currentPage = page; renderUserTable(); }

    let editingUid = null;

    function openEditModal(uid) {
      const u = userData.find(d => d.uid === uid);
      if (!u) return;
      editingUid = uid;
      document.getElementById('editUserLabel').textContent = `UID-${uid} · ${u.name}`;
      document.getElementById('editNominalDisplay').value = u.nominal.toFixed(2);
      document.getElementById('editActualInput').value = u.actual;
      document.getElementById('editRemarkInput').value = '';
      openModal('editModal');
    }

    function confirmEdit() {
      const input = document.getElementById('editActualInput');
      const val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { showToast('请输入有效的金额（最小为 0）'); return; }
      const u = userData.find(d => d.uid === editingUid);
      if (!u) return;
      const oldVal = u.actual;
      u.actual = +val.toFixed(2);

      const remark = document.getElementById('editRemarkInput').value.trim();
      const now = new Date();
      const timeStr = now.toLocaleString('zh-CN', {hour12:false});
      modificationHistory.push({ uid: u.uid, userName: u.name, oldActual: oldVal, newActual: u.actual, remark, time: timeStr });
      updateHistoryBadge();

      closeModal('editModal');
      renderPage();
      showToast(`✅ 已更新 UID-${editingUid} 实际产出为 ${u.actual.toFixed(2)} STORY`);
      editingUid = null;
    }

    function updateActual(uid, value) {
      const val = parseFloat(value);
      if (isNaN(val) || val < 0) return;
      const u = userData.find(d => d.uid === uid);
      if (!u) return;
      u.actual = +val.toFixed(2);
      document.getElementById('mTotalActual').textContent = fmt(userData.reduce((s,u) => s + u.actual, 0));
    }

    function openBatchEditModal() {
      const status = weekStatuses[currentWeek] || 'pending';
      if (status !== 'pending') { showToast('该周期已放行，不可修改'); return; }
      document.getElementById('batchActualInput').value = '';
      openModal('batchEditModal');
    }

    function confirmBatchEdit() {
      const input = document.getElementById('batchActualInput');
      const val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { showToast('请输入有效的金额（最小为 0）'); return; }
      const rounded = +val.toFixed(2);
      const now = new Date();
      const timeStr = now.toLocaleString('zh-CN', {hour12:false});

      userData.forEach(u => {
        if (u.actual !== rounded) {
          modificationHistory.push({ uid: u.uid, userName: u.name, oldActual: u.actual, newActual: rounded, remark: '批量修改', time: timeStr });
        }
        u.actual = rounded;
      });
      updateHistoryBadge();

      closeModal('batchEditModal');
      renderPage();
      showToast(`✅ 已将所有用户实际产出统一设为 ${rounded} STORY`);
    }

    document.addEventListener('DOMContentLoaded', function() {
      const weekParam = getQueryParam('week');
      currentWeek = weekParam ? parseInt(weekParam) : 22;
      if (!weekInfoMap[currentWeek]) currentWeek = 22;
      userData = generateUserData(currentWeek);
      renderPage();
      const searchInput = document.getElementById('uidSearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          uidSearchKeyword = e.target.value;
          renderUserTable();
        });
      }
    });
  </script>
</body>
</html>
