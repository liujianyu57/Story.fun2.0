<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 1011分享审核</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.10);
      --text: #13202e;
      --text-secondary: #5e6f83;
      --text-tertiary: #8b8d98;
      --border: #deeaf7;
      --border-light: #e8f0fa;
      --shadow-sm: 0 2px 8px rgba(27, 45, 71, 0.04);
      --radius: 16px;
      --radius-sm: 10px;
      --danger: #f45b69;
      --warning: #ff9f2c;
      --gold: #f5b042;
      --story-green: #05DF72;
      --story-teal: #00BBA7;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
    @media (max-width: 640px) { .app-shell { padding: 16px; } }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      margin-bottom: 24px;
    }
    .page-header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.015em; }

    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }

    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-light); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 12px 14px; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    .data-table th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border-light); font-size: 0.78rem; letter-spacing: 0.02em; background: #f8fbfe; }
    .data-table td { border-bottom: 1px solid var(--border-light); }
    .data-table tr:last-of-type td { border-bottom: none; }
    .data-table tr:hover td { background: #f8fbfe; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-badge.pending { background: #fff8e5; color: #b8860b; border: 1px solid #f0d78c; }
    .status-badge.approved { background: #e6f7ee; color: #0a7e3c; border: 1px solid #a8e6c0; }
    .status-badge.rejected { background: #fde8e8; color: #c0392b; border: 1px solid #f5b7b1; }

    .btn-sm {
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm.approve { background: var(--story-green); color: #fff; }
    .btn-sm.approve:hover { opacity: 0.85; }
    .btn-sm.reject { background: var(--danger); color: #fff; }
    .btn-sm.reject:hover { opacity: 0.85; }
    .btn-sm:disabled { opacity: 0.4; cursor: default; }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
      font-size: 0.9rem;
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

    .link-cell {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--accent);
      text-decoration: none;
    }
    .link-cell:hover { text-decoration: underline; }

    .code-cell {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    /* ===== 确认最终活动数据 ===== */
    .confirm-btn {
      padding: 10px 24px;
      border-radius: 30px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--accent);
      color: #fff;
    }
    .confirm-btn:disabled {
      background: #d0d8e0;
      color: #8b8d98;
      cursor: not-allowed;
    }
    .confirm-btn:not(:disabled):hover {
      opacity: 0.85;
    }

    /* ===== 调试面板 ===== */
    .debug-panel {
      position: fixed;
      right: 16px;
      bottom: 100px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.20);
    }
    .debug-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: rgba(255,255,255,0.40);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 2px;
    }
    .debug-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.75);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .debug-btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="admin-sidebar-placeholder"></div>

  <div class="app-shell">
    <div class="page-header">
      <h1>📖 1011分享审核</h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:0.85rem;color:var(--text-secondary);">审核用户提交的分享链接是否与 1011 相关</span>
        <button class="confirm-btn" id="confirmFinalBtn" disabled>🔒 确认最终活动数据</button>
      </div>
    </div>

    <div class="section-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid rgba(0,179,136,0.15);font-size:0.8rem;color:var(--accent);font-weight:500;">
          <span>⏰</span>
          <span>提交后默认 <strong>48 小时</strong> 自动通过审核</span>
        </div>
      </div>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="pending">待审核</button>
        <button class="filter-btn" data-filter="approved">已通过</button>
        <button class="filter-btn" data-filter="rejected">已拒绝</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>UID</th>
              <th>用户名</th>
              <th>平台</th>
              <th>链接</th>
              <th>验证码</th>
              <th>提交时间</th>
              <th>自动通过期限</th>
              <th>状态</th>
              <th>拒绝理由</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="reviewBody">
            <!-- JS 动态渲染 -->
          </tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="emoji">📭</div>
        <div>暂无待审核的分享链接</div>
      </div>
    </div>
  </div>

  <!-- 拒绝理由弹窗 -->
  <div class="modal-overlay" id="rejectModal" style="position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,0.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;">
    <div class="modal-box" style="background:#fff;border-radius:16px;padding:28px 24px 24px;max-width:420px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.15);text-align:center;animation:modalSlideUp 0.3s ease;">
      <div style="font-size:36px;margin-bottom:10px;">❌</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px;">拒绝理由</div>
      <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:16px;line-height:1.6;">请填写拒绝原因，用户将收到通知</div>
      <textarea id="rejectReasonInput" style="width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #e8ecf0;font-family:inherit;font-size:14px;color:var(--text);outline:none;resize:vertical;min-height:80px;margin-bottom:18px;background:#fafbfc;" placeholder="例如：链接与 1011 主题无关，请重新提交"></textarea>
      <div class="modal-box-actions" style="display:flex;gap:10px;">
        <button class="modal-btn-cancel" id="rejectModalCancel" style="flex:1;padding:12px 20px;border-radius:60px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:#f1f5f9;color:var(--muted);transition:all 0.2s;">取消</button>
        <button class="modal-btn-confirm" id="rejectModalConfirm" style="flex:1;padding:12px 20px;border-radius:60px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:#c0392b;color:#fff;transition:all 0.2s;">确认拒绝</button>
      </div>
    </div>
  </div>
  <style>
    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-overlay.open { display: flex !important; }
  </style>

  <script src="load-admin-sidebar.js"></script>

  <!-- 确认最终活动数据弹窗 -->
  <div class="modal-overlay" id="confirmFinalModal" style="position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,0.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;">
    <div class="modal-box" style="background:#fff;border-radius:16px;padding:28px 24px 24px;max-width:480px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.15);text-align:center;animation:modalSlideUp 0.3s ease;">
      <div style="font-size:40px;margin-bottom:12px;">🔒</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:12px;letter-spacing:-0.3px;">确认最终活动数据</div>
      <div style="font-size:14px;color:var(--text-tertiary);line-height:1.7;margin-bottom:20px;padding:0 8px;">
        请确认所有数据无误，提交后无法再更改数据，用户积分排行榜将最终定稿。
      </div>
      <div class="modal-box-actions" style="display:flex;gap:10px;">
        <button class="modal-btn-cancel" id="confirmFinalCancel" style="flex:1;padding:12px 20px;border-radius:60px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:#f1f5f9;color:var(--muted);transition:all 0.2s;">取消</button>
        <button class="modal-btn-confirm" id="confirmFinalConfirm" style="flex:1;padding:12px 20px;border-radius:60px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:var(--accent);color:#fff;transition:all 0.2s;">确认提交</button>
      </div>
    </div>
  </div>

  <!-- 调试面板 -->
  <div class="debug-panel" id="debugPanel">
    <div class="debug-label">🎛️ 调试工具</div>
    <button class="debug-btn" id="debugNotEnded">⏳ 活动未结束</button>
    <button class="debug-btn" id="debugEnded">✅ 活动已结束</button>
  </div>

  <script>
    (function() {
      var currentFilter = 'all';


      // 平台名称映射
      var PLATFORM_LABELS = {
        twitter: { name: '𝕏 Twitter / X', color: '#1DA1F2' },
        tiktok: { name: '🎵 TikTok', color: '#000' },
        youtube: { name: '▶️ YouTube', color: '#FF0000' }
      };

      // 状态中文
      var STATUS_LABELS = {
        pending: '待审核',
        approved: '已通过',
        rejected: '已拒绝'
      };

      function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&').replace(/"/g, '"').replace(/'/g, '&#39;').replace(/</g, '<').replace(/>/g, '>');
      }

      // ===== 静态模拟数据（不与用户端关联） =====
      var STORAGE_KEY = '1011_admin_mock_data';

      function generateMockData() {
        var now = new Date();
        function fmtDate(d) {
          return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        }

        // 过去的时间点用于模拟
        var t1 = new Date(now); t1.setHours(t1.getHours() - 72);  // 72小时前 → 自动通过期限已过
        var t2 = new Date(now); t2.setHours(t2.getHours() - 30);  // 30小时前 → 未超期
        var t3 = new Date(now); t3.setHours(t3.getHours() - 50);  // 50小时前 → 超过48h
        var t4 = new Date(now); t4.setHours(t4.getHours() - 10);  // 10小时前 → 未超期
        var t5 = new Date(now); t5.setHours(t5.getHours() - 96);  // 96小时前 → 已通过

        return {
          twitter: { uid: 'u_001', username: '加密探险家', link: 'https://x.com/user1/status/123456', code: 'SF-A3X7K9P2', time: fmtDate(t1), status: 'pending', views: 0, likes: 0, shares: 0 },
          tiktok: { uid: 'u_002', username: '链上观察者', link: 'https://tiktok.com/@user2/video/789', code: 'SF-B5M8N1Q4', time: fmtDate(t2), status: 'pending', views: 0, likes: 0, shares: 0 },
          youtube: { uid: 'u_003', username: 'DeFi研究员', link: 'https://youtube.com/watch?v=abc123', code: 'SF-C9K2R6T8', time: fmtDate(t3), status: 'pending', views: 0, likes: 0, shares: 0 },
          twitter2: { uid: 'u_004', username: '牛市守望者', link: 'https://x.com/user4/status/234567', code: 'SF-D4H7J1L5', time: fmtDate(t4), status: 'pending', views: 0, likes: 0, shares: 0 },
          twitter3: { uid: 'u_005', username: '合约大师', link: 'https://x.com/user5/status/345678', code: 'SF-E6N3Q9W2', time: fmtDate(t5), status: 'approved', views: 1280, likes: 86, shares: 23 },
          youtubeRejected: { uid: 'u_006', username: '空投猎人', link: 'https://youtube.com/watch?v=def456', code: 'SF-F8K2M5N1', time: fmtDate(t3), status: 'rejected', views: 0, likes: 0, shares: 0, rejectReason: '链接内容与 1011 主题无关，请重新提交' }
        };

      }

      function loadData() {
        // 首次加载时从 localStorage 读取，如果不存在则使用初始模拟数据
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            return JSON.parse(raw);
          } catch(e) {
            // fallback
          }
        }
        var mock = generateMockData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mock));
        return mock;
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // ===== 拒绝理由弹窗 =====
      var pendingRejectPlatform = null;
      var rejectModal = document.getElementById('rejectModal');
      var rejectInput = document.getElementById('rejectReasonInput');
      var rejectCancel = document.getElementById('rejectModalCancel');
      var rejectConfirm = document.getElementById('rejectModalConfirm');

      function openRejectModal(platform) {
        pendingRejectPlatform = platform;
        rejectInput.value = '';
        rejectModal.classList.add('open');
        setTimeout(function() { rejectInput.focus(); }, 100);
      }
      function closeRejectModal() {
        rejectModal.classList.remove('open');
        pendingRejectPlatform = null;
      }

      rejectCancel.addEventListener('click', closeRejectModal);
      rejectConfirm.addEventListener('click', function() {
        var platform = pendingRejectPlatform;
        var reason = rejectInput.value.trim();
        if (!reason) {
          rejectInput.style.borderColor = '#c0392b';
          rejectInput.setAttribute('placeholder', '请填写拒绝理由');
          return;
        }
        var data = loadData();
        if (data[platform]) {
          data[platform].status = 'rejected';
          data[platform].rejectReason = reason;
          saveData(data);
          renderTable();
        }
        closeRejectModal();
      });
      rejectModal.addEventListener('click', function(e) {
        if (e.target === rejectModal) closeRejectModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && rejectModal.classList.contains('open')) closeRejectModal();
      });
      rejectInput.addEventListener('input', function() {
        this.style.borderColor = '#e8ecf0';
      });

      function renderTable() {

        var data = loadData();
        var tbody = document.getElementById('reviewBody');
        var empty = document.getElementById('emptyState');
        var entries = Object.keys(data).map(function(p) {
          return { platform: p, item: data[p] };
        });

        // 筛选
        if (currentFilter !== 'all') {
          entries = entries.filter(function(e) { return e.item.status === currentFilter; });
        }

        if (entries.length === 0) {
          tbody.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';

        var html = '';
        entries.forEach(function(entry) {
          var p = entry.platform;
          var item = entry.item;
          var label = PLATFORM_LABELS[p] || { name: p, color: '#888' };
          var statusLabel = STATUS_LABELS[item.status] || item.status;

          var statusClass = item.status === 'pending' ? 'pending' : (item.status === 'approved' ? 'approved' : 'rejected');

          // 计算自动通过期限（提交时间 + 48 小时）
          var autoPassTime = '-';
          if (item.time) {
            var timeParts = item.time.split(/[\/ :]/);
            if (timeParts.length === 5) {
              var d = new Date(timeParts[0], timeParts[1] - 1, timeParts[2], timeParts[3], timeParts[4]);
              d.setHours(d.getHours() + 48);
              var y = d.getFullYear();
              var m = String(d.getMonth() + 1).padStart(2, '0');
              var day = String(d.getDate()).padStart(2, '0');
              var h = String(d.getHours()).padStart(2, '0');
              var min = String(d.getMinutes()).padStart(2, '0');
              autoPassTime = y + '/' + m + '/' + day + ' ' + h + ':' + min;
            }
          }

          // 判断是否已超过自动通过期限
          var isOverdue = false;
          if (item.status === 'pending' && autoPassTime !== '-') {
            var deadlineParts = autoPassTime.split(/[\/ :]/);
            var deadline = new Date(deadlineParts[0], deadlineParts[1] - 1, deadlineParts[2], deadlineParts[3], deadlineParts[4]);
            if (new Date() > deadline) isOverdue = true;
          }

          // 判断是否已最终确认定稿
          var isFinalConfirmed = localStorage.getItem('1011_final_confirmed') === 'true';

          var actionHtml = '';

          if (item.status === 'pending') {
            if (isFinalConfirmed) {
              actionHtml = '<span style="font-size:0.75rem;color:var(--text-tertiary);">已定稿</span>';
            } else {
              actionHtml = '<button class="btn-sm approve" data-platform="' + p + '" data-action="approve">通过</button>' +
                           '<button class="btn-sm reject" data-platform="' + p + '" data-action="reject" style="margin-left:6px;">拒绝</button>';
            }
          } else if (item.status === 'approved') {
            var views = item.views || 0;
            var likes = item.likes || 0;
            var shares = item.shares || 0;
            if (isFinalConfirmed) {
              actionHtml = '<div style="display:flex;align-items:center;gap:6px;flex-wrap:nowrap;">' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">播放</span>' +
                '<span style="font-size:0.78rem;font-weight:600;color:var(--text);min-width:40px;text-align:center;">' + views + '</span>' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">点赞</span>' +
                '<span style="font-size:0.78rem;font-weight:600;color:var(--text);min-width:40px;text-align:center;">' + likes + '</span>' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">转发</span>' +
                '<span style="font-size:0.78rem;font-weight:600;color:var(--text);min-width:40px;text-align:center;">' + shares + '</span>' +
                '<span style="font-size:0.65rem;color:var(--accent);font-weight:500;margin-left:4px;">🔒 已定稿</span>' +
                '</div>';
            } else {
              actionHtml = '<div style="display:flex;align-items:center;gap:6px;flex-wrap:nowrap;">' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">播放</span>' +
                '<input type="number" class="metric-input" data-platform="' + p + '" data-metric="views" value="' + views + '" style="width:50px;padding:3px 4px;border:1px solid var(--border-light);border-radius:6px;font-size:0.75rem;text-align:center;" />' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">点赞</span>' +
                '<input type="number" class="metric-input" data-platform="' + p + '" data-metric="likes" value="' + likes + '" style="width:50px;padding:3px 4px;border:1px solid var(--border-light);border-radius:6px;font-size:0.75rem;text-align:center;" />' +
                '<span style="font-size:0.7rem;color:var(--text-tertiary);white-space:nowrap;">转发</span>' +
                '<input type="number" class="metric-input" data-platform="' + p + '" data-metric="shares" value="' + shares + '" style="width:50px;padding:3px 4px;border:1px solid var(--border-light);border-radius:6px;font-size:0.75rem;text-align:center;" />' +
                '<button class="btn-sm approve" data-platform="' + p + '" data-action="save-metrics" style="margin-left:4px;padding:4px 10px;font-size:0.7rem;">保存</button>' +
                '</div>';
            }
          } else if (item.status === 'rejected') {
            actionHtml = '<span style="font-size:0.75rem;color:var(--text-tertiary);">已拒绝</span>';
          }

          // 自动通过期限显示文案
          var deadlineHtml = autoPassTime;
          if (isOverdue) {
            deadlineHtml += ' <span style="color:#c0392b;font-weight:700;">⚠️</span>';
          }

          // 拒绝理由列
          var rejectReasonHtml = '-';
          if (item.status === 'rejected') {
            rejectReasonHtml = item.rejectReason
              ? '<span style="font-size:0.75rem;color:#c0392b;max-width:180px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escHtml(item.rejectReason) + '">' + escHtml(item.rejectReason) + '</span>'
              : '<span style="font-size:0.75rem;color:var(--text-tertiary);">已拒绝</span>';
          }

          html += '<tr>' +
            '<td style="font-size:0.78rem;color:var(--text-tertiary);">' + escHtml(item.uid || '-') + '</td>' +
            '<td style="font-size:0.78rem;color:var(--text);">' + escHtml(item.username || '-') + '</td>' +
            '<td><span style="font-weight:500;">' + label.name + '</span></td>' +
            '<td><a class="link-cell" href="' + item.link + '" target="_blank" rel="noopener noreferrer" title="' + item.link + '">' + item.link + '</a></td>' +
            '<td><span class="code-cell">' + (item.code || '-') + '</span></td>' +
            '<td style="font-size:0.78rem;color:var(--text-tertiary);">' + (item.time || '-') + '</td>' +
            '<td style="font-size:0.78rem;' + (isOverdue ? 'color:#c0392b;font-weight:600;' : 'color:var(--text-tertiary);') + '">' + deadlineHtml + '</td>' +
            '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
            '<td>' + rejectReasonHtml + '</td>' +
            '<td>' + actionHtml + '</td>' +
            '</tr>';

        });
        tbody.innerHTML = html;

        // 绑定操作按钮事件
        tbody.querySelectorAll('.btn-sm.approve').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var platform = this.dataset.platform;
            var data = loadData();
            if (data[platform]) {
              data[platform].status = 'approved';
              saveData(data);
              renderTable();
            }
          });
        });

        // 拒绝按钮：打开弹窗输入理由
        tbody.querySelectorAll('.btn-sm.reject').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var platform = this.dataset.platform;
            openRejectModal(platform);
          });
        });


        // 绑定保存指标按钮事件
        tbody.querySelectorAll('.btn-sm[data-action="save-metrics"]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var platform = this.dataset.platform;
            var data = loadData();
            if (!data[platform]) return;
            // 读取三个输入框的值
            var row = this.closest('tr');
            var inputs = row.querySelectorAll('.metric-input');
            inputs.forEach(function(input) {
              var metric = input.dataset.metric;
              var val = parseInt(input.value, 10);
              if (isNaN(val)) val = 0;
              data[platform][metric] = val;
            });
            saveData(data);
            // 按钮反馈
            var origText = this.textContent;
            this.textContent = '✓ 已保存';
            var self = this;
            setTimeout(function() { self.textContent = origText; }, 1500);
          });
        });
      }


      // 筛选按钮事件
      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderTable();
        });
      });

      // ===== 确认最终活动数据 =====
      var confirmFinalBtn = document.getElementById('confirmFinalBtn');
      var confirmFinalModal = document.getElementById('confirmFinalModal');
      var confirmFinalCancel = document.getElementById('confirmFinalCancel');
      var confirmFinalConfirm = document.getElementById('confirmFinalConfirm');

      // 判断活动是否已结束（从 localStorage 读取 1011_activity_time）
      function isActivityEnded() {
        try {
          var activityTimeData = localStorage.getItem('1011_activity_time');
          if (!activityTimeData) return false;
          var activityTime = JSON.parse(activityTimeData);
          if (!activityTime.end) return false;
          var endTime = new Date(activityTime.end).getTime();
          return !isNaN(endTime) && Date.now() > endTime;
        } catch(e) {
          return false;
        }
      }

      function updateConfirmBtnState() {
        if (isActivityEnded()) {
          confirmFinalBtn.disabled = false;
          confirmFinalBtn.textContent = '✅ 确认最终活动数据';
        } else {
          confirmFinalBtn.disabled = true;
          confirmFinalBtn.textContent = '🔒 确认最终活动数据';
        }
      }

      function openConfirmFinalModal() {
        confirmFinalModal.classList.add('open');
      }

      function closeConfirmFinalModal() {
        confirmFinalModal.classList.remove('open');
      }

      confirmFinalBtn.addEventListener('click', function() {
        if (this.disabled) return;
        openConfirmFinalModal();
      });

      confirmFinalCancel.addEventListener('click', closeConfirmFinalModal);

      confirmFinalConfirm.addEventListener('click', function() {
        // 执行最终确认逻辑：标记已确认
        localStorage.setItem('1011_final_confirmed', 'true');
        closeConfirmFinalModal();
        // 按钮置为已确认状态
        confirmFinalBtn.disabled = true;
        confirmFinalBtn.textContent = '✅ 已确认定稿';
        confirmFinalBtn.style.background = '#0a7e3c';
        // 弹出提示（简单 toast）
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#13202e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:10000;box-shadow:0 12px 40px rgba(0,0,0,0.15);';
        toast.textContent = '✅ 活动数据已最终确认，积分排行榜已定稿';
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
      });

      confirmFinalModal.addEventListener('click', function(e) {
        if (e.target === confirmFinalModal) closeConfirmFinalModal();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && confirmFinalModal.classList.contains('open')) closeConfirmFinalModal();
      });

      // ===== 调试按钮：模拟活动状态 =====
      var debugNotEnded = document.getElementById('debugNotEnded');
      var debugEnded = document.getElementById('debugEnded');

      debugNotEnded.addEventListener('click', function() {
        // 设置活动结束时间为未来（活动未结束）
        var farFuture = new Date();
        farFuture.setFullYear(farFuture.getFullYear() + 10);
        localStorage.setItem('1011_activity_time', JSON.stringify({
          start: new Date().toISOString(),
          end: farFuture.toISOString()
        }));
        updateConfirmBtnState();
        // 显示反馈
        var orig = this.textContent;
        this.textContent = '✓ 已设为活动未结束';
        var self = this;
        setTimeout(function() { self.textContent = orig; }, 1500);
      });

      debugEnded.addEventListener('click', function() {
        // 设置活动结束时间为过去（活动已结束）
        var past = new Date();
        past.setFullYear(past.getFullYear() - 1);
        localStorage.setItem('1011_activity_time', JSON.stringify({
          start: new Date(past.getTime() - 86400000).toISOString(),
          end: past.toISOString()
        }));
        updateConfirmBtnState();
        // 显示反馈
        var orig = this.textContent;
        this.textContent = '✓ 已设为活动已结束';
        var self = this;
        setTimeout(function() { self.textContent = orig; }, 1500);
      });

      // 初始渲染
      renderTable();

      // 初始化确认按钮状态
      updateConfirmBtnState();
      // 检查是否已经确认过
      if (localStorage.getItem('1011_final_confirmed') === 'true') {
        confirmFinalBtn.disabled = true;
        confirmFinalBtn.textContent = '✅ 已确认定稿';
        confirmFinalBtn.style.background = '#0a7e3c';
      }

      // 每 3 秒自动刷新
      setInterval(renderTable, 3000);
    })();
  </script>
</body>
</html>
