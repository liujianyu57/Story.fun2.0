<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 挖矿结算管理</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.10);
      --text: #13202e;
      --text-secondary: #5e6f83;
      --text-tertiary: #8b8d98;
      --border: #deeaf7;
      --border-light: #e8f0fa;
      --shadow-sm: 0 2px 8px rgba(27, 45, 71, 0.04);
      --radius: 16px;
      --radius-sm: 10px;
      --danger: #f45b69;
      --warning: #ff9f2c;
      --gold: #f5b042;
      --story-green: #05DF72;
      --story-teal: #00BBA7;
      font-family: -apple-system, "PingFang SC", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
    @media (max-width: 640px) { .app-shell { padding: 16px; } }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 28px;
      margin-bottom: 24px;
    }
    .page-header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.015em; }

    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }

    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-light); }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { padding: 12px 14px; text-align: left; font-size: 0.85rem; white-space: nowrap; }
    .data-table th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border-light); font-size: 0.78rem; letter-spacing: 0.02em; background: #f8fbfe; }
    .data-table td { border-bottom: 1px solid var(--border-light); }
    .data-table tr:last-of-type td { border-bottom: none; }
    .data-table tr:hover td { background: #f8fbfe; cursor: pointer; }
    .data-table .clickable { cursor: pointer; }

    .status-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status-tag.pending { background: rgba(255, 159, 44, 0.12); color: #d4942a; }
    .status-tag.approved { background: rgba(0, 179, 136, 0.10); color: var(--accent); }

    .btn-sm {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; border-radius: 999px; border: none;
      background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn-sm:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,179,136,0.25); }
    .btn-sm:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    .btn-sm-outline {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; text-decoration: none;
    }
    .btn-sm-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm-outline.approved { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); cursor: default; }

    .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 16px; }
    .pagination button {
      padding: 6px 16px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--text-secondary); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .pagination button:hover { border-color: var(--accent); color: var(--accent); }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .pagination .page-info { font-size: 0.82rem; color: var(--text-tertiary); }

    .empty-state { text-align: center; padding: 48px 0; color: var(--text-tertiary); font-size: 0.88rem; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 5000;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(27,45,71,0.2);
      width: 90%; max-width: 420px; max-height: 80vh; overflow-y: auto;
      padding: 28px 32px;
    }
    .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-box .modal-header h3 { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .modal-box .modal-close {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: none; background: rgba(0,0,0,0.04); border-radius: 50%; cursor: pointer;
      font-size: 1.2rem; color: var(--text-secondary); transition: background 0.15s;
    }
    .modal-box .modal-close:hover { background: rgba(0,0,0,0.08); }
    .modal-box .modal-body { margin-bottom: 20px; }
    .modal-box .modal-body p { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
    .modal-box .modal-body .highlight { font-weight: 700; color: var(--text); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-modal-cancel {
      padding: 10px 24px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-secondary); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-modal-cancel:hover { border-color: var(--text-secondary); }
    .btn-modal-confirm {
      padding: 10px 24px; border-radius: 999px; border: none;
      background: var(--accent); color: #fff; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-modal-confirm:hover { opacity: 0.85; }
    .btn-modal-confirm.danger { background: var(--danger); }
    .btn-modal-confirm:disabled { opacity: 0.4; cursor: default; }

    .toast-notification {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px);
      z-index: 9999; background: rgba(26,35,47,0.95); backdrop-filter: blur(8px);
      color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 0.88rem;
      box-shadow: 0 12px 40px rgba(27,45,71,0.25);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
      opacity: 0; pointer-events: none; max-width: 400px; text-align: center; font-weight: 500;
    }
    .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div id="admin-sidebar-placeholder"></div>

  <div class="app-shell">

    <div class="page-header">
      <h1>⛏️ 挖矿结算管理</h1>
    </div>

    <!-- 周期列表 -->
    <div class="section-card">
      <div class="table-wrap">
        <table class="data-table" id="weekTable">
          <thead>
            <tr>
              <th style="min-width:180px;">周期</th>
              <th style="width:100px;">用户数</th>
              <th style="width:140px;">实际产出 (STORY)</th>
              <th style="width:90px;">状态</th>
              <th style="width:140px;">自动放行期限</th>
              <th style="width:140px;">放行时间</th>
              <th style="width:100px;">操作</th>
            </tr>
          </thead>
          <tbody id="weekBody">
            <!-- 由 JS 渲染 -->
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

  </div>

  <!-- 放行确认弹窗 -->
  <div class="modal-overlay" id="approveModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>确认放行周期</h3>
        <button class="modal-close" onclick="closeModal('approveModal')">✕</button>
      </div>
      <div class="modal-body">
        <p>确认放行周期 <span class="highlight" id="approveWeekLabel">06/09 ~ 06/15</span> 的挖矿结算？</p>
        <p>放行后该周期内所有用户的收益将进入可领取状态。</p>
        <p style="display:flex;justify-content:space-between;font-size:0.88rem;">
          <span>总金额：</span>
          <span class="highlight" id="approveAmount">0 STORY</span>
        </p>
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal('approveModal')">取消</button>
        <button class="btn-modal-confirm" onclick="confirmApprove()">确认放行</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-notification" id="toastNotification">
    <span id="toastMessage"></span>
  </div>

  <script src="load-admin-sidebar.js"></script>
  <script>
    // ================================================================
    //  模拟数据
    // ================================================================

    const WEEK_DATA = [
      { week:22, range:'06/09 ~ 06/15', users:128, amount:1852300, status:'pending', autoRelease:'06/18 15:00', approvedTime:'' },
      { week:21, range:'06/02 ~ 06/08', users:156, amount:2102900, status:'approved', autoRelease:'06/11 15:00', approvedTime:'06/10 14:32' },
      { week:20, range:'05/26 ~ 06/01', users:142, amount:1987600, status:'approved', autoRelease:'06/04 15:00', approvedTime:'06/03 09:17' },
      { week:19, range:'05/19 ~ 05/25', users:115, amount:1754000, status:'approved', autoRelease:'05/28 15:00', approvedTime:'05/28 10:45' },
      { week:18, range:'05/12 ~ 05/18', users:168, amount:2117300, status:'approved', autoRelease:'05/21 15:00', approvedTime:'05/21 08:30' },
      { week:17, range:'05/05 ~ 05/11', users:134, amount:1921500, status:'pending', autoRelease:'05/14 15:00', approvedTime:'' },
      { week:16, range:'04/28 ~ 05/04', users:127, amount:1884200, status:'approved', autoRelease:'05/07 15:00', approvedTime:'05/06 16:22' },
      { week:15, range:'04/21 ~ 04/27', users:172, amount:2131700, status:'approved', autoRelease:'04/30 15:00', approvedTime:'04/30 14:08' },
      { week:14, range:'04/14 ~ 04/20', users:119, amount:2011300, status:'approved', autoRelease:'04/23 15:00', approvedTime:'04/22 11:35' },
      { week:13, range:'04/07 ~ 04/13', users:108, amount:1896400, status:'pending', autoRelease:'04/16 15:00', approvedTime:'' },
      { week:12, range:'03/31 ~ 04/06', users:161, amount:2146100, status:'approved', autoRelease:'04/09 15:00', approvedTime:'04/08 13:50' },
      { week:11, range:'03/24 ~ 03/30', users:145, amount:1968200, status:'approved', autoRelease:'04/02 15:00', approvedTime:'04/01 09:12' },
      { week:10, range:'03/17 ~ 03/23', users:178, amount:2155700, status:'approved', autoRelease:'03/26 15:00', approvedTime:'03/25 17:40' },
      { week:9,  range:'03/10 ~ 03/16', users:98,  amount:1789300, status:'approved', autoRelease:'03/19 15:00', approvedTime:'03/18 10:05' },
      { week:8,  range:'03/03 ~ 03/09', users:132, amount:2038200, status:'approved', autoRelease:'03/12 15:00', approvedTime:'03/11 15:30' },
      { week:7,  range:'02/24 ~ 03/02', users:155, amount:2170100, status:'approved', autoRelease:'03/05 15:00', approvedTime:'03/04 08:55' },
      { week:6,  range:'02/17 ~ 02/23', users:111, amount:1857600, status:'approved', autoRelease:'02/26 15:00', approvedTime:'02/25 14:20' },
      { week:5,  range:'02/10 ~ 02/16', users:124, amount:1924500, status:'approved', autoRelease:'02/19 15:00', approvedTime:'02/18 11:48' },
      { week:4,  range:'02/03 ~ 02/09', users:166, amount:2184500, status:'approved', autoRelease:'02/12 15:00', approvedTime:'02/11 09:33' },
      { week:3,  range:'01/27 ~ 02/02', users:87,  amount:1748200, status:'approved', autoRelease:'02/05 15:00', approvedTime:'02/04 16:15' },
      { week:2,  range:'01/20 ~ 01/26', users:153, amount:2194100, status:'approved', autoRelease:'01/29 15:00', approvedTime:'01/28 10:00' },
      { week:1,  range:'01/13 ~ 01/19', users:136, amount:2034700, status:'approved', autoRelease:'01/22 15:00', approvedTime:'01/21 13:42' },
    ];

    let currentPage = 1;
    const PAGE_SIZE = 10;

    function getWeekData() { return WEEK_DATA; }

    function fmt(n) {
      if (n >= 1000000000) return (n/1000000000).toFixed(2) + 'B';
      if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n/1000).toFixed(1) + 'k';
      return n.toLocaleString();
    }

    function showToast(msg) {
      const t = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function goTo(u) { window.location.href = u; }

    function renderWeekList() {
      const data = getWeekData();
      const totalPages = Math.ceil(data.length / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageData = data.slice(start, start + PAGE_SIZE);
      const tbody = document.getElementById('weekBody');
      tbody.innerHTML = pageData.map(w => {
        const statusLabel = w.status === 'pending' ? '结算中' : '已放行';
        const statusClass = w.status === 'pending' ? 'pending' : 'approved';
        const btnHtml = w.status === 'pending'
          ? `<button class="btn-sm" onclick="event.stopPropagation();openApproveModal(${w.week})">放行</button>`
          : `<span class="btn-sm-outline approved">✓ 已放行</span>`;
        const autoReleaseLabel = w.status === 'pending'
          ? `<span style="color:var(--text-secondary);font-size:0.82rem;">${w.autoRelease}</span>`
          : `<span style="color:var(--text-tertiary);font-size:0.82rem;">${w.autoRelease}</span>`;
        const approvedTimeLabel = w.approvedTime ? `<span style="color:var(--accent);font-size:0.82rem;">${w.approvedTime}</span>` : `<span style="color:var(--text-tertiary);font-size:0.82rem;">--</span>`;
        return `<tr onclick="goToDetail(${w.week})">
          <td><strong>${w.range}</strong></td>
          <td>${w.users}</td>
          <td style="font-weight:600;color:var(--accent);">${fmt(w.amount)}</td>
          <td><span class="status-tag ${statusClass}">${statusLabel}</span></td>
          <td>${autoReleaseLabel}</td>
          <td>${approvedTimeLabel}</td>
          <td>${btnHtml}</td>
        </tr>`;
      }).join('');
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <button ${currentPage <= 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">← 上一页</button>
        <span class="page-info">第 ${currentPage} / ${totalPages} 页</span>
        <button ${currentPage >= totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">下一页 →</button>`;
    }

    function changePage(page) { currentPage = page; renderWeekList(); }
    function goToDetail(week) { goTo('admin-mining-detail.html?week=' + week); }

    let approveWeekId = null;

    function openApproveModal(week) {
      const w = WEEK_DATA.find(d => d.week === week);
      if (!w) return;
      approveWeekId = week;
      document.getElementById('approveWeekLabel').textContent = `${w.range}`;
      document.getElementById('approveAmount').textContent = fmt(w.amount) + ' STORY';
      openModal('approveModal');
    }

    function confirmApprove() {
      if (!approveWeekId) return;
      const w = WEEK_DATA.find(d => d.week === approveWeekId);
      if (!w) return;
      w.status = 'approved';
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      w.approvedTime = `${mm}/${dd} ${hh}:${mi}`;
      closeModal('approveModal');
      renderWeekList();
      showToast(`✅ ${w.range} 已放行，共 ${fmt(w.amount)} STORY`);
      approveWeekId = null;
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderWeekList();
    });
  </script>
</body>
</html>
