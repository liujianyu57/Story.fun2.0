<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Story.fun | 发布视频</title>
  <style>
    :root {
      --bg: #f5faff;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.12);
      --text: #13202e;
      --text-muted: #5e6f83;
      --border: #deeaf7;
      --danger: #f45b69;
      font-family: "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; min-height: 100vh; background: #F2F2F7; color: #1C1C1E; -webkit-tap-highlight-color: transparent; }
    input, textarea, button { font-family: inherit; }

    /* ===== Navigation Bar ===== */
    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 12px; padding-top: env(safe-area-inset-top, 0px);
      background: rgba(255,255,255,0.94); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.33px solid rgba(0,0,0,0.1);
    }
    .nav-bar .nav-left {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 10px; border: none; background: none;
      color: #1C1C1E; font-size: 0.92rem; font-weight: 500; cursor: pointer;
      border-radius: 8px; transition: background 0.15s;
    }
    .nav-bar .nav-left:active { background: rgba(0,0,0,0.05); }
    .nav-bar .nav-left svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-bar .nav-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 1rem; font-weight: 700; white-space: nowrap;
    }

    /* ===== Main Content ===== */
    .page-content {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      padding-top: 48px;
      padding-top: calc(48px + env(safe-area-inset-top, 0px));
      padding-bottom: 80px;
      padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== Video Gallery Grid ===== */
    .gallery-header {
      padding: 16px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .gallery-header h2 {
      font-size: 1.1rem; font-weight: 700;
    }
    .gallery-header .gallery-count {
      font-size: 0.82rem; color: rgba(255,255,255,0.45);
    }
    .video-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 3px; padding: 0 12px 32px;
    }
    .video-grid-item {
      position: relative; aspect-ratio: 1 / 1;
      background: #1a1a1a; border-radius: 4px;
      overflow: hidden; cursor: pointer;
    }
    .video-grid-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .video-grid-item .duration-badge {
      position: absolute; bottom: 6px; left: 6px;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.02em;
    }
    .video-grid-item .check-circle {
      position: absolute; top: 6px; right: 6px;
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.3);
      display: grid; place-items: center;
      font-size: 0.65rem; color: #fff;
      transition: all 0.2s ease;
      z-index: 2;
    }
    .video-grid-item.selected .check-circle {
      background: var(--accent);
      border-color: var(--accent);
    }
    .video-grid-item .check-circle svg {
      width: 12px; height: 12px; display: none;
    }
    .video-grid-item.selected .check-circle svg {
      display: block;
    }

    /* ===== Bottom Bar ===== */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(0,0,0,0.08);
      display: flex; align-items: center; gap: 12px;
    }
    .bottom-bar .next-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      font-size: 1rem; font-weight: 700;
      background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.25);
      cursor: pointer; transition: all 0.2s ease;
    }
    .bottom-bar .next-btn.active {
      background: var(--accent); color: #fff;
    }
    .bottom-bar .next-btn:active { opacity: 0.8; }
    .bottom-bar .publish-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      font-size: 1rem; font-weight: 700;
      background: var(--accent); color: #fff;
      cursor: pointer; transition: opacity 0.15s; display: none;
    }
    .bottom-bar .publish-btn.show { display: block; }
    .bottom-bar .publish-btn:active { opacity: 0.8; }
    .bottom-bar .publish-btn:disabled { opacity: 0.4; }

    /* ===== Edit Cover Button ===== */
    .edit-cover-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      border-radius: 999px; border: 0.5px solid rgba(0,0,0,0.15);
      background: rgba(0,0,0,0.04);
      color: rgba(0,0,0,0.5); font-size: 0.8rem;
      font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .edit-cover-btn:active { background: rgba(0,0,0,0.08); }

    /* ===== Preview Modal (fullscreen video player) ===== */
    .preview-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      display: none; flex-direction: column;
    }
    .preview-overlay.show { display: flex; }
    .preview-overlay .preview-close {
      position: absolute; top: 16px; left: 16px;
      top: calc(16px + env(safe-area-inset-top, 0px));
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none; color: #fff; font-size: 1.2rem;
      cursor: pointer; display: grid; place-items: center;
      z-index: 10;
    }
    .preview-overlay .preview-top-bar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
      z-index: 5; display: flex; align-items: center; gap: 12px;
    }
    .preview-overlay .preview-top-bar .preview-title-sm {
      font-size: 0.95rem; font-weight: 600; flex: 1;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .preview-overlay .preview-video-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .preview-overlay .preview-video-area video {
      width: 100%; max-height: 100%; display: block; object-fit: contain;
    }
    .preview-overlay .preview-progress {
      position: absolute; bottom: 120px; left: 16px; right: 16px;
      height: 3px; background: rgba(255,255,255,0.2);
      border-radius: 2px; overflow: hidden; z-index: 5;
    }
    .preview-overlay .preview-progress .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.15s linear; width: 0%;
    }
    .preview-overlay .preview-time {
      position: absolute; bottom: 128px; right: 16px;
      font-size: 0.75rem; color: rgba(255,255,255,0.6); z-index: 5;
    }
    .preview-overlay .preview-play-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      border: none; cursor: pointer; display: grid; place-items: center;
      z-index: 5; transition: opacity 0.2s;
    }
    .preview-overlay .preview-play-btn.hidden { opacity: 0; pointer-events: none; }
    .preview-overlay .preview-play-btn svg { width: 28px; height: 28px; fill: #fff; margin-left: 2px; }
    .preview-overlay .preview-bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10; display: flex; align-items: center; gap: 12px;
    }
    .preview-overlay .preview-bottom-bar .next-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: none;
      font-size: 1rem; font-weight: 700;
      background: var(--accent); color: #fff;
      cursor: pointer; transition: opacity 0.15s;
    }
    .preview-overlay .preview-bottom-bar .next-btn:active { opacity: 0.8; }
    .preview-overlay .preview-bottom-bar .select-btn {
      padding: 14px 24px; border-radius: 14px; border: none;
      font-size: 0.92rem; font-weight: 600;
      background: rgba(255,255,255,0.12); color: #fff;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .preview-overlay .preview-bottom-bar .select-btn:active { background: rgba(255,255,255,0.2); }
    .preview-overlay .preview-bottom-bar .select-btn.selected {
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
    }

    /* ===== Editor View (hidden until selection confirmed) ===== */
    .nav-bar .nav-right {
      display: flex; align-items: center; gap: 4px;
      padding: 7px 18px; border: none;
      background: var(--accent); color: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      border-radius: 20px; transition: opacity 0.15s;
      opacity: 0; pointer-events: none;
    }
    .nav-bar .nav-right.show { opacity: 1; pointer-events: auto; }
    .nav-bar .nav-right:active { opacity: 0.8; }
    .nav-bar .nav-right:disabled { opacity: 0.4; cursor: not-allowed; }

    .video-stage {
      position: relative; width: 100%;
      background: transparent;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px; gap: 12px;
    }
    .video-stage .stage-placeholder {
      width: auto; max-width: 140px;
      aspect-ratio: 9 / 16;
      object-fit: cover; display: block;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .video-stage .video-play-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center; pointer-events: none;
    }
    .video-stage .video-play-icon svg {
      width: 24px; height: 24px; fill: #fff; margin-left: 2px;
    }
    .form-section {
      padding: 16px 16px 32px;
      background: transparent;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: rgba(0,0,0,0.45); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 4px;
    }
    .form-group input[type="text"],
    .form-group textarea {
      width: 100%; padding: 14px 16px;
      border-radius: 14px; border: none;
      background: #fff;
      color: #1C1C1E; font-size: 0.95rem; outline: none;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      box-shadow: 0 0 0 2px rgba(0,179,136,0.3);
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-group .char-count {
      text-align: right; font-size: 0.78rem;
      color: rgba(0,0,0,0.3); margin-top: 4px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      z-index: 9999; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: #fff; padding: 16px 28px; border-radius: 16px;
      font-size: 0.95rem; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* ===== Desktop responsive ===== */
    @media (min-width: 681px) {
      body { background: var(--bg); color: var(--text); }
      .nav-bar { background: var(--surface); color: var(--text); border-bottom: 1px solid var(--border); }
      .nav-bar .nav-left { color: var(--text); }
      .nav-bar .nav-title { color: var(--text); }
      .nav-bar .nav-right { background: var(--accent); }
      .page-content { background: var(--bg); padding: 16px 24px; position: static; padding-bottom: 100px; }
      .gallery-header h2 { color: var(--text); }
      .gallery-header .gallery-count { color: var(--text-muted); }
      .video-grid { gap: 12px; padding: 0 0 32px; }
      .video-grid-item { border-radius: 12px; }
      .bottom-bar { background: var(--surface); border-top: 1px solid var(--border); }
      .bottom-bar .next-btn { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.25); }
      .bottom-bar .next-btn.active { background: var(--accent); color: #fff; }
      .form-section { background: var(--surface); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
      .form-group label { color: var(--text-muted); }
      .form-group input[type="text"],
      .form-group textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
      .form-group input[type="text"]:focus,
      .form-group textarea:focus { background: #fff; }
      .cover-upload { border-color: var(--border); background: var(--bg); }
      .cover-upload p { color: var(--text-muted); }
      .tag-option { background: var(--bg); border-color: var(--border); color: var(--text-muted); }
      .tag-option:active { background: var(--accent-soft); }
      .video-meta { color: var(--text-muted); }
      .video-stage { border-radius: 12px; }
      .form-group .char-count { color: var(--text-muted); }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-left" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="nav-title" id="navTitle">选择视频</span>
  </div>

  <div class="page-content">
    <!-- Gallery View -->
    <div id="galleryView">
      <div class="gallery-header">
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- Editor View (hidden until next step) -->
    <div id="editorView" style="display:none;">
      <div class="video-stage">
        <img class="stage-placeholder" id="editorCover" src="" alt="" />
        <div class="video-play-icon">
          <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="white"/></svg>
        </div>
        <button class="edit-cover-btn" onclick="openCoverPicker()">编辑封面</button>
        <input type="file" accept="image/*" id="coverInput" style="display:none;" />
      </div>
      <div class="form-section">
        <div class="form-group" id="descGroup">
          <textarea id="inputDesc" placeholder="添加作品描述..." rows="4"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar">
    <button class="next-btn" id="nextBtn" disabled onclick="goToEditor()">
      下一步 <span id="nextCount" style="display:none;">(0)</span>
    </button>
    <button class="publish-btn" id="publishBarBtn" onclick="publishVideo()">发布</button>
  </div>

  <!-- Preview Modal (fullscreen video player) -->
  <div class="preview-overlay" id="previewOverlay">
    <button class="preview-close" onclick="closePreview()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="preview-video-area" onclick="togglePreviewPlay()">
      <video id="previewVideo" src="" playsinline webkit-playsinline x5-video-player-type="h5"></video>
      <div class="preview-play-btn" id="previewPlayBtn">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
      </div>
    </div>
    <div class="preview-progress" id="previewProgress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="preview-time" id="previewTime">0:00 / 0:00</div>
    <div class="preview-bottom-bar">
      <button class="next-btn" onclick="goToEditorFromPreview()">下一步</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let selectedVideoId = null;
  let previewVideoId = null;
  let editVideo = null;

  // ===== Dummy Video Data =====
  const videoGallery = [
    { id: 1, title: '丞相府今日开饭', cover: 'image/chengxiangfu_cover.jpg', duration: '0:32' },
    { id: 2, title: '打斗精彩片段', cover: 'image/chengxiangfu_cover.jpg', duration: '1:15' },
    { id: 3, title: '凤骨琉璃 EP01', cover: 'image/fenggu_cover.jpg', duration: '0:58' },
    { id: 4, title: '我卸甲后天下大乱了', cover: 'image/xiejia_cover.jpg', duration: '2:01' },
    { id: 5, title: '凤骨琉璃 EP02', cover: 'image/fenggu_cover.jpg', duration: '0:45' },
    { id: 6, title: '长安如梦 EP01', cover: 'image/cover-candle.png', duration: '1:30' },
    { id: 7, title: '长安如梦 EP02', cover: 'image/cover-survivor.png', duration: '1:22' },
    { id: 8, title: '零夜序章', cover: 'image/cover-zero-night.png', duration: '0:55' },
    { id: 9, title: '金字塔探险', cover: 'image/cover-pyramid.png', duration: '1:08' },
    { id: 10, title: '全押时刻', cover: 'image/cover-allin.png', duration: '3:12' },
    { id: 11, title: '名字的故事', cover: 'image/cover-names.png', duration: '0:48' },
    { id: 12, title: '暗流涌动', cover: 'image/cover-candle.png', duration: '1:40' },
  ];

  // ===== Render Gallery =====
  function renderGallery() {
    const grid = document.getElementById('videoGrid');
    grid.innerHTML = videoGallery.map(v => {
      const isSelected = selectedVideoId === v.id;
      return `
        <div class="video-grid-item ${isSelected ? 'selected' : ''}" data-id="${v.id}">
          <img src="${v.cover}" alt="${v.title}" onerror="this.style.background='linear-gradient(135deg, #1a2a3a, #0d1b2a)'" />
          <span class="duration-badge">${v.duration}</span>
          <div class="check-circle" onclick="event.stopPropagation();toggleSelect(${v.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div onclick="openPreview(${v.id})" style="position:absolute;inset:0;z-index:1;"></div>
        </div>`;
    }).join('');
    updateNextBtn();
  }

  renderGallery();

  // ===== Select / Deselect (single select) =====
  function toggleSelect(id) {
    if (selectedVideoId === id) {
      // Deselect
      const prevCard = document.querySelector(`.video-grid-item[data-id="${id}"]`);
      if (prevCard) prevCard.classList.remove('selected');
      selectedVideoId = null;
    } else {
      // Deselect previous
      if (selectedVideoId !== null) {
        const prevCard = document.querySelector(`.video-grid-item[data-id="${selectedVideoId}"]`);
        if (prevCard) prevCard.classList.remove('selected');
      }
      // Select new
      selectedVideoId = id;
      const card = document.querySelector(`.video-grid-item[data-id="${id}"]`);
      if (card) card.classList.add('selected');
    }
    updateNextBtn();
  }

  function updateNextBtn() {
    const btn = document.getElementById('nextBtn');
    if (selectedVideoId !== null) {
      btn.classList.add('active');
      btn.disabled = false;
      btn.textContent = '下一步';
    } else {
      btn.classList.remove('active');
      btn.disabled = true;
      btn.textContent = '下一步';
    }
  }

  // ===== Preview (fullscreen video) =====
  function openPreview(id) {
    const video = videoGallery.find(v => v.id === id);
    if (!video) return;
    previewVideoId = id;

    updatePreviewSelectBtn();

    // Use actual video file from video/ directory (map by id)
    const videoEl = document.getElementById('previewVideo');
    const videoSrc = getVideoSrc(id);
    videoEl.src = videoSrc;
    videoEl.currentTime = 0;

    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('previewTime').textContent = '0:00 / ' + video.duration;
    document.getElementById('previewPlayBtn').classList.remove('hidden');

    document.getElementById('previewOverlay').classList.add('show');

    // Auto-play after a short delay
    setTimeout(() => {
      videoEl.play().then(() => {
        document.getElementById('previewPlayBtn').classList.add('hidden');
        updateProgressLoop();
      }).catch(() => {});
    }, 400);
  }

  function getVideoSrc(id) {
    // Map gallery IDs to actual video files in video/ directory
    const videoMap = {
      1: 'video/丞相府今日开饭.mp4',
      2: 'video/打斗视频.mp4',
      3: 'video/凤骨琉璃.mp4',
      4: 'video/我卸甲后天下大乱了.mp4',
      5: 'video/凤骨琉璃.mp4',
      6: 'video/打斗视频.mp4',
      7: 'video/我卸甲后天下大乱了.mp4',
      8: 'video/丞相府今日开饭.mp4',
      9: 'video/凤骨琉璃.mp4',
      10: 'video/我卸甲后天下大乱了.mp4',
      11: 'video/打斗视频.mp4',
      12: 'video/丞相府今日开饭.mp4',
    };
    return videoMap[id] || 'video/凤骨琉璃.mp4';
  }

  let progressInterval = null;
  function updateProgressLoop() {
    const video = document.getElementById('previewVideo');
    const fill = document.getElementById('progressFill');
    const time = document.getElementById('previewTime');

    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      fill.style.width = pct + '%';
      time.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
    }, 150);

    video.addEventListener('ended', () => {
      document.getElementById('previewPlayBtn').classList.remove('hidden');
      if (progressInterval) clearInterval(progressInterval);
    });
    video.addEventListener('pause', () => {
      document.getElementById('previewPlayBtn').classList.remove('hidden');
    });
    video.addEventListener('play', () => {
      document.getElementById('previewPlayBtn').classList.add('hidden');
    });
  }

  function togglePreviewPlay() {
    const video = document.getElementById('previewVideo');
    if (video.paused) {
      video.play().catch(() => {});
    } else {
      video.pause();
    }
  }

  function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + s.toString().padStart(2, '0');
  }

  function closePreview() {
    const video = document.getElementById('previewVideo');
    video.pause();
    video.removeAttribute('src');
    video.load();
    if (progressInterval) clearInterval(progressInterval);
    document.getElementById('previewOverlay').classList.remove('show');
    document.getElementById('previewPlayBtn').classList.remove('hidden');
    previewVideoId = null;
  }

  function updatePreviewSelectBtn() {
    // select button removed - no-op
  }

  function toggleSelectFromPreview() {
    if (previewVideoId === null) return;
    toggleSelect(previewVideoId);
    updatePreviewSelectBtn();
  }

  function goToEditorFromPreview() {
    if (selectedVideoId === null) {
      if (previewVideoId !== null) {
        toggleSelect(previewVideoId);
        updatePreviewSelectBtn();
      }
    }
    if (selectedVideoId === null) {
      showToast('请先选择视频');
      return;
    }
    closePreview();
    goToEditor();
  }

  // ===== Go to Editor =====
  function goToEditor() {
    if (selectedVideoId === null) return;
    const video = videoGallery.find(v => v.id === selectedVideoId);
    if (!video) return;
    editVideo = video;

    // Hide gallery, switch bottom bar
    document.getElementById('galleryView').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('editorView').style.display = 'block';
    document.getElementById('navTitle').textContent = '';

    // Show publish button in bottom bar
    const publishBarBtn = document.getElementById('publishBarBtn');
    publishBarBtn.classList.add('show');
    publishBarBtn.disabled = false;
    publishBarBtn.textContent = '发布';

    // Set cover
    document.getElementById('editorCover').src = video.cover;

    // Reset form
    document.getElementById('inputDesc').value = '';

    // Bind cover input
    bindCoverInput();
  }

  // ===== Open Cover Picker =====
  function openCoverPicker() {
    document.getElementById('coverInput').click();
  }

  // ===== Cover Upload =====
  function bindCoverInput() {
    const input = document.getElementById('coverInput');
    if (!input) return;
    input.addEventListener('change', function(e) {
      if (e.target.files.length === 0) return;
      const file = e.target.files[0];
      if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('editorCover').src = ev.target.result;
      };
      reader.readAsDataURL(file);
      this.value = '';
    });
  }

  // ===== Desc with 100 char limit =====
  document.getElementById('inputDesc').addEventListener('input', function() {
    if (this.value.length > 100) {
      this.value = this.value.slice(0, 100);
      showToast('最多输入100字');
    }
  });


  // ===== Back =====
  function goBack() {
    if (document.getElementById('editorView').style.display !== 'none') {
      document.getElementById('editorView').style.display = 'none';
      document.getElementById('galleryView').style.display = 'block';
      document.getElementById('nextBtn').style.display = '';
      document.getElementById('navTitle').textContent = '选择视频';
      document.getElementById('publishBarBtn').classList.remove('show');
      editVideo = null;
    } else if (window.history.length > 1) {
      history.back();
    } else {
      window.location.href = 'recommend.html';
    }
  }

  // ===== Publish =====
  function publishVideo() {
    const btn = document.getElementById('publishBarBtn');
    btn.disabled = true;
    btn.textContent = '发布中...';

    setTimeout(() => {
      showToast('✅ 发布成功！');
      setTimeout(() => { history.back(); }, 1000);
    }, 800);
  }

  // ===== Utilities =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>

</body>
</html>
