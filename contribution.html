<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贡献度 | Story.fun</title>
<script src="items.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.08);
    --ink: #f2f4f8;
    --muted: #8a93a6;
    --gold: #f5b042;
    --violet: #a78bfa;
    --mono: 'SF Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .bg-glow {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(640px 320px at 50% -5%, rgba(167,139,250,.20), transparent 70%),
      radial-gradient(520px 280px at 10% 6%, rgba(245,176,66,.10), transparent 70%),
      radial-gradient(520px 280px at 90% 8%, rgba(56,189,248,.08), transparent 70%);
  }
  .bg-grid {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 78%);
    mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, #000 25%, transparent 78%);
  }
  main { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:52px 24px 60px; }
  .back-btn {
    position:fixed; top:18px; left:18px; z-index:5; width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:var(--ink);
    cursor:pointer; display:none; align-items:center; justify-content:center; transition:background .2s;
  }
  .back-btn:hover { background:rgba(255,255,255,.12); }
  /* Hero */
  .hero { text-align:center; padding:14px 0 8px; }
  .token-badge {
    width:52px; height:52px; margin:0 auto 18px; border-radius:15px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; letter-spacing:.08em; color:#14100a;
    background:linear-gradient(135deg,#f5b042 0%,#a78bfa 100%);
    box-shadow:0 0 22px rgba(167,139,250,.55), 0 0 46px rgba(245,176,66,.30), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .hero-label { font-size:12px; font-weight:600; letter-spacing:.16em; color:var(--muted); line-height:1.6; }
  .hero-score { font-size:76px; font-weight:700; letter-spacing:-.02em; color:#fff; line-height:1.15; margin-top:10px; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  .hero-score .unit { font-size:20px; font-weight:600; color:var(--muted); margin-left:8px; letter-spacing:0; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif; }
  /* 未登录占位 */
  .locked-tip {
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:var(--muted); font-size:15px; font-weight:500; line-height:1.6;
    border:1px solid var(--card-border); background:var(--card); border-radius:20px; padding:46px 24px;
  }
  .locked-tip svg { width:20px; height:20px; flex-shrink:0; color:var(--gold); }
  .locked-tip span { color:#c6ccd8; }
  .hero-score .unit { font-size:20px; font-weight:600; color:var(--muted); margin-left:8px; letter-spacing:0; }
  /* 空投提示条（信息条，非按钮） */
  .airdrop-bar {
    margin:28px auto 34px; max-width:560px; text-align:center; padding:13px 18px; border-radius:14px;
    font-size:14px; font-weight:600; color:#f5b042; line-height:1.5;
    background:rgba(255,255,255,.04); border:1px solid rgba(245,176,66,.35);
  }
  /* Bento */
  .bento { display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:118px; gap:14px; }
  .card {
    position:relative; border:1px solid var(--card-border); background:var(--card); border-radius:20px; padding:16px;
    display:flex; flex-direction:column; justify-content:space-between; overflow:hidden;
    transition:transform .25s, box-shadow .25s, border-color .25s;
    opacity:0; transform:translateY(14px); animation:rise .6s ease forwards;
  }
  .card:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35); border-color:rgba(255,255,255,.16); }
  .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.19s}
  .card:nth-child(4){animation-delay:.26s}.card:nth-child(5){animation-delay:.33s}.card:nth-child(6){animation-delay:.40s}
  @keyframes rise { to { opacity:1; transform:none; } }
  .card .icon { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:#d8dce6; }
  .card .icon svg { width:19px; height:19px; }
  .card .name { font-size:13px; font-weight:600; color:#c6ccd8; line-height:1.4; }
  .card .stat { display:flex; align-items:baseline; justify-content:space-between; }
  .card .count { font-size:13px; color:var(--muted); line-height:1.4; }
  .card .pts { font-size:16px; font-weight:700; color:var(--gold); font-family:var(--mono); line-height:1.4; }
  .card.big { grid-column:span 4; grid-row:span 2; }
  .card.tall { grid-column:span 2; grid-row:span 2; }
  .card.wide { grid-column:span 3; }
  .card.small { grid-column:span 2; }
  .card.big .big-head, .card.tall .big-head { display:flex; align-items:baseline; gap:10px; }
  .card.big .big-score { font-size:38px; font-weight:700; color:#fff; letter-spacing:-.01em; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  .card.tall .big-score { font-size:30px; font-weight:700; color:#fff; letter-spacing:-.01em; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  .card.big .big-sub, .card.tall .big-sub { font-size:12px; color:var(--muted); line-height:1.5; }
  .card.big .big-total, .card.tall .big-total { margin-top:auto; font-size:15px; font-weight:700; color:var(--gold); line-height:1.4; }
  .tagline { text-align:center; margin-top:46px; font-size:13px; letter-spacing:.08em; color:var(--muted); line-height:1.6; }
  /* 规则与明细 */
  .sec-title { font-size:13px; font-weight:600; letter-spacing:.1em; color:var(--muted); margin:38px 0 14px; }
  .card-panel { border:1px solid var(--card-border); background:var(--card); border-radius:20px; overflow:hidden; }
  .rule-row, .det-row { display:flex; align-items:center; gap:12px; padding:14px 16px; line-height:1.5; }
  .rule-row + .rule-row, .det-row + .det-row { border-top:1px solid rgba(255,255,255,.06); }
  .rule-name { flex:1; font-size:14px; color:#c6ccd8; line-height:1.5; }
  .rule-desc { font-size:12px; color:var(--muted); line-height:1.5; }
  .rule-pts { font-size:15px; font-weight:700; color:var(--gold); flex-shrink:0; font-family:var(--mono); line-height:1.4; }
  .det-time { width:74px; font-size:11px; color:var(--muted); flex-shrink:0; line-height:1.4; }
  .det-act { flex:1; font-size:13px; color:#c6ccd8; line-height:1.5; }
  .det-pts { font-size:13px; font-weight:700; color:var(--gold); flex-shrink:0; font-family:var(--mono); line-height:1.4; }
  /* 阶段 CTA */
  .phase-cta { text-align:center; margin:30px auto 150px; }
  .phase-cta button {
    padding:13px 44px; border-radius:999px; border:none; cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:.02em; font-family:inherit;
    background:linear-gradient(120deg,#f5b042,#a78bfa); color:#14100a;
    box-shadow:0 8px 28px rgba(167,139,250,.30);
    transition:transform .2s, box-shadow .2s, opacity .2s;
  }
  .phase-cta button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 34px rgba(167,139,250,.42); }
  .phase-cta button:disabled { cursor:not-allowed; opacity:.42; box-shadow:none; }
  @media (max-width:768px) {
    main { padding:44px 16px 48px; }
    .back-btn { display:flex; }
    .hero-score { font-size:54px; }
    .bento { grid-template-columns:repeat(2,1fr); grid-auto-rows:104px; }
    .card.big { grid-column:span 2; grid-row:span 2; }
    .card.tall { grid-column:span 2; grid-row:span 2; }
    .card.wide { grid-column:span 2; }
    .card.small { grid-column:span 1; }
  }
  /* ── 本页深色导航覆盖（仅 contribution.html）── */
  body.dark-nav .app-sidebar { background:rgba(11,14,20,.96); border-right:1px solid rgba(255,255,255,.06); }
  body.dark-nav .app-sidebar { overflow-y:auto; }
  body.dark-nav .sb-nav-item { color:#8a93a6; }
  body.dark-nav .sb-nav-item:hover { background:rgba(255,255,255,.06); color:#f2f4f8; }
  body.dark-nav .sb-nav-item.active { color:#fff; background:rgba(167,139,250,.18); }
  body.dark-nav .sb-divider { background:rgba(255,255,255,.08); }
  body.dark-nav .sb-settings { border-top:1px solid rgba(255,255,255,.08); }
  body.dark-nav .sb-settings-trigger { color:#8a93a6; }
  body.dark-nav .sb-settings-trigger:hover { background:rgba(255,255,255,.06); color:#f2f4f8; }
  body.dark-nav .sb-submenu, body.dark-nav .sb-settings-menu { background:rgba(17,21,30,.97); border:1px solid rgba(255,255,255,.08); }
  body.dark-nav .sb-submenu a, body.dark-nav .sb-settings-item { color:#8a93a6; }
  body.dark-nav .sb-submenu a:hover, body.dark-nav .sb-settings-item:hover { background:rgba(255,255,255,.06); color:#f2f4f8; }
  body.dark-nav .desktop-header { background:rgba(11,14,20,.96); border-bottom:1px solid rgba(255,255,255,.06); }
  body.dark-nav .desktop-header .dh-search { background:rgba(255,255,255,.07); border-color:transparent; }
  body.dark-nav .desktop-header .dh-search svg { color:rgba(255,255,255,.4); }
  body.dark-nav .desktop-header .dh-search input { color:#f2f4f8; }
  body.dark-nav .desktop-header .dh-search input::placeholder { color:rgba(255,255,255,.35); }
  body.dark-nav .desktop-header .dh-search:focus-within { border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.1); box-shadow:0 0 0 3px rgba(255,255,255,.08); }
  body.dark-nav .desktop-header .dh-search-btn { background:rgba(255,255,255,.1); color:rgba(255,255,255,.55); }
  body.dark-nav .desktop-header .dh-search-btn:hover { background:#f2f4f8; color:#0b0e14; }
  body.dark-nav .desktop-header .dh-icon-btn { color:rgba(255,255,255,.6); }
  body.dark-nav .desktop-header .dh-icon-btn:hover { background:rgba(255,255,255,.08); color:#fff; }
  body.dark-nav .desktop-header .dh-publish-btn { background:#f2f4f8; color:#0b0e14; }
  body.dark-nav .desktop-header .dh-publish-btn:hover { box-shadow:0 4px 12px rgba(0,0,0,.4); }
  body.dark-nav .desktop-header .dh-login-btn { border-color:rgba(255,255,255,.6); color:#f2f4f8; }
  body.dark-nav .desktop-header .dh-login-btn:hover { background:rgba(255,255,255,.12); }
  body.dark-nav .desktop-header .dh-usdc-badge { background:rgba(255,255,255,.08); color:#f2f4f8; }
  body.dark-nav .auth-login-btn { border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.06); color:#f2f4f8; }
  body.dark-nav .auth-login-btn:hover { border-color:#fff; color:#fff; background:rgba(255,255,255,.12); }
  body.dark-nav .desktop-header .dh-search-dropdown,
  body.dark-nav .desktop-header .dh-shop-dropdown,
  body.dark-nav .desktop-header .dh-notify-dropdown,
  body.dark-nav .desktop-header .dh-publish-dropdown { background:rgba(17,21,30,.97); border-color:rgba(255,255,255,.08); }
  body.dark-nav .desktop-header .sd-section-title { color:#8a93a6; }
  body.dark-nav .desktop-header .sd-item { color:#c6ccd8; }
  body.dark-nav .desktop-header .sd-item:hover { background:rgba(255,255,255,.05); }
  body.dark-nav .desktop-header .sd-del { color:#8a93a6; }
  body.dark-nav .desktop-header .dh-publish-item { color:#c6ccd8; }
  body.dark-nav .desktop-header .dh-publish-item:hover { background:rgba(255,255,255,.05); color:#fff; }
  body.dark-nav .desktop-header .dn-tab { color:#8a93a6; }
  body.dark-nav .desktop-header .dn-tab.active { color:#fff; }
  body.dark-nav .desktop-header .notify-item { background:rgba(255,255,255,.05); box-shadow:none; }
  body.dark-nav .desktop-header .notify-desc { color:#c6ccd8; }
  body.dark-nav .desktop-header .revenue-title { color:#f5b042; background:rgba(245,176,66,.12); }
  body.dark-nav .desktop-header .notify-meta, body.dark-nav .desktop-header .notify-time { color:#8a93a6; }
  body.dark-nav .desktop-header .rev-act-btn { background:#f2f4f8; color:#0b0e14; }
  body.dark-nav .desktop-header .follow-btn { border-color:rgba(255,255,255,.35); color:#c6ccd8; }
  body.dark-nav .desktop-header .follow-btn.mutual { background:rgba(255,255,255,.1); border-color:transparent; }
  body.dark-nav .desktop-header .sact-btn { border-color:rgba(255,255,255,.15); color:#8a93a6; }
  body.dark-nav .desktop-header .dh-shop-dropdown > div { color:#f2f4f8; }
  body.dark-nav .desktop-header .dh-notify-dropdown { background:rgba(17,21,30,.98); }
  body.dark-nav .bottom-nav-wrapper { background:rgba(11,14,20,.92); border-top:1px solid rgba(255,255,255,.08); }
  body.dark-nav .bottom-nav-item { color:rgba(255,255,255,.55); }
  body.dark-nav .bottom-nav-item.active { color:#f5b042; }
  body.dark-nav .bottom-nav-item.bottom-nav-create { background:#f5b042; box-shadow:0 4px 10px rgba(245,176,66,.35); }
</style>
</head>
<body class="dark-nav">
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<button class="back-btn" onclick="history.back()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
<main>
  <header class="hero">
    <div class="token-badge">STORY</div>
    <div class="hero-label">贡献值</div>
    <div class="hero-score" id="heroScoreWrap"><span id="heroScore">0</span><span class="unit">分</span></div>
    <div class="locked-tip hero-locked" id="heroLocked" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>登录后查看你的贡献值</span>
    </div>
  </header>

  <div class="airdrop-bar" id="airdropBar">TGE 前贡献越多，空投越多 STORY</div>

  <div class="phase-cta"><button id="phaseCtaBtn">TGE 后领取</button></div>

  <section class="bento" id="bento"></section>
  <div class="locked-tip bento-locked" id="bentoLocked" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>登录后查看你的贡献明细</span>
  </div>

  <div class="sec-title">计分规则</div>
  <div class="card-panel" id="rulesList"></div>

  <div class="sec-title" id="detailTitle">贡献明细</div>
  <div class="card-panel" id="detailList"></div>
  <div class="locked-tip detail-locked" id="detailLocked" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>登录后查看你的贡献明细</span>
  </div>

  <footer class="tagline">贡献，即未来的 STORY</footer>
</main>
<script>
(function () {
  // 登录态（全站通用：auth.js 的 storyfun_user）
  var loggedIn = false;
  try {
    var _u = JSON.parse(localStorage.getItem('storyfun_user') || 'null');
    loggedIn = !!(_u && _u.isLoggedIn);
  } catch (e) { loggedIn = false; }

  // 贡献数据：纯展示演示值
  var items = [
    { name: '签约', count: 12, unit: '张', pts: 500, big: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>' },
    { name: '演出', count: 345, unit: 'h', pts: 10, tall: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>' },
    { name: '补充体力', count: 28, unit: '次', pts: 100, wide: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>' },
    { name: '升级', count: 3, unit: '级', pts: 200, wide: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>' },
    { name: '登录', count: 18, unit: '天', pts: 10, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' },
    { name: '互动', count: 86, unit: '次', pts: 1, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' },
    { name: '邀请', count: 5, unit: '人', pts: 10, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>' },
  ];
  items.forEach(function (it) { it.total = it.count * it.pts; });
  var grand = items.reduce(function (a, b) { return a + b.total; }, 0);

  // 大数字滚动（仅登录后）
  if (loggedIn) {
    var scoreEl = document.getElementById('heroScore');
    var t0 = null;
    function tick(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / 1200);
      var e = 1 - Math.pow(1 - p, 3);
      scoreEl.textContent = Math.round(grand * e).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  } else {
    document.getElementById('heroScoreWrap').style.display = 'none';
    document.getElementById('heroLocked').style.display = 'flex';
    document.getElementById('bento').style.display = 'none';
    document.getElementById('bentoLocked').style.display = 'flex';
    document.getElementById('detailTitle').style.display = 'none';
    document.getElementById('detailList').style.display = 'none';
    document.getElementById('detailLocked').style.display = 'flex';
  }

  // 空投提示（按阶段 × 登录态）
  var phase = (window.SFPhase && SFPhase.get()) || 'pre';
  var barTexts = {
    pre: 'TGE 前贡献越多，空投越多 STORY',
    airdrop: '空投已开放领取',
    mining: '挖矿已开放'
  };
  // 演示值：待领取 STORY 数量（接入真实数据后替换）
  var pendingAirdrop = 666;
  document.getElementById('airdropBar').textContent =
    loggedIn && phase === 'airdrop'
      ? '待领取 ' + pendingAirdrop + ' STORY'
      : (barTexts[phase] || barTexts.pre);

  // 阶段 CTA
  var ctaBtn = document.getElementById('phaseCtaBtn');
  if (!loggedIn) {
    // 未登录：引导登录
    ctaBtn.textContent = '登录后领取';
    ctaBtn.addEventListener('click', function () {
      if (typeof openLoginModal === 'function') openLoginModal();
      else if (typeof showToast === 'function') showToast('请先登录');
    });
  } else {
    // 已登录：按阶段
    var ctaTexts = { pre: 'TGE 后领取', airdrop: '领取 STORY', mining: '开始挖矿' };
    ctaBtn.textContent = ctaTexts[phase] || ctaTexts.pre;
    if (phase === 'pre') {
      ctaBtn.disabled = true;
    } else {
      ctaBtn.addEventListener('click', function () {
        if (phase === 'mining') { location.href = 'studio.html'; return; }
        if (typeof showToast === 'function') { showToast('演示：空投领取流程待接入'); }
      });
    }
  }

  // Bento 卡片（仅登录后渲染）
  if (loggedIn) {
    var html = '';
    items.forEach(function (it) {
      var cls = it.big ? 'big' : (it.tall ? 'tall' : (it.wide ? 'wide' : 'small'));
      var inner = '<div class="card ' + cls + '"><div class="icon">' + it.icon + '</div><div class="name">' + it.name + '</div>';
      if (it.big || it.tall) {
        inner += '<div class="big-head"><div class="big-score">' + it.count.toLocaleString() + '</div><div class="big-sub">' + it.unit + ' · +' + it.pts + '/' + it.unit + '</div></div>'
          + '<div class="big-total">+' + it.total.toLocaleString() + ' 分</div>';
      } else {
        inner += '<div class="stat"><span class="count">×' + it.count.toLocaleString() + ' ' + it.unit + '</span><span class="pts">+' + it.total + '分</span></div>';
      }
      inner += '</div>';
      html += inner;
    });
    document.getElementById('bento').innerHTML = html;
  }

  // 计分规则
  var rules = [
    { name: '签约角色', pts: '+500/个', desc: '每签约 1 个角色' },
    { name: '角色演出', pts: '+10/小时', desc: '演出每满 1 小时' },
    { name: '补充体力', pts: '+100/次', desc: '每补充 1 次' },
    { name: '角色升级', pts: '+200/级', desc: '每提升 1 级' },
    { name: '每日登录', pts: '+10/天', desc: '每天登录 1 次' },
    { name: '平台互动', pts: '+1/次', desc: '点赞 / 收藏' },
    { name: '邀请好友', pts: '+10/人', desc: '每邀请 1 人' },
  ];
  document.getElementById('rulesList').innerHTML = rules.map(function (r) {
    return '<div class="rule-row"><span class="rule-name">' + r.name + '</span><span class="rule-desc">' + r.desc + '</span><span class="rule-pts">' + r.pts + '</span></div>';
  }).join('');

  // 贡献明细（示例样式，仅登录后）
  if (loggedIn) {
    var det = [
      ['06-20 12:30', '签约角色', '+500'],
      ['06-20 18:05', '角色演出', '+10'],
      ['06-21 09:00', '每日登录', '+10'],
      ['06-21 10:20', '补充体力', '+100'],
      ['06-22 14:15', '角色升级', '+200'],
      ['06-22 20:40', '邀请好友', '+10'],
      ['06-23 08:30', '每日登录', '+10'],
      ['06-23 21:10', '互动', '+1'],
      ['06-24 11:00', '角色演出', '+20'],
      ['06-24 19:45', '签约角色', '+500'],
    ];
    document.getElementById('detailList').innerHTML = det.map(function (d) {
      return '<div class="det-row"><span class="det-time">' + d[0] + '</span><span class="det-act">' + d[1] + '</span><span class="det-pts">' + d[2] + '</span></div>';
    }).join('');
  }
  // 登录态变化（登录/退出）后刷新页面，切换登录/未登录展示
  document.addEventListener('auth-ready', function () { location.reload(); });
})();
</script>
