<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贡献度 | Story.fun</title>
<script src="items.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.08);
    --ink: #f2f4f8;
    --muted: #8a93a6;
    --gold: #f5b042;
    --violet: #a78bfa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .bg-glow {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(640px 320px at 50% -5%, rgba(167,139,250,.20), transparent 70%),
      radial-gradient(520px 280px at 10% 6%, rgba(245,176,66,.10), transparent 70%),
      radial-gradient(520px 280px at 90% 8%, rgba(56,189,248,.08), transparent 70%);
  }
  main { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:52px 24px 60px; }
  .back-btn {
    position:fixed; top:18px; left:18px; z-index:5; width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s;
  }
  .back-btn:hover { background:rgba(255,255,255,.12); }
  /* Hero */
  .hero { text-align:center; padding:10px 0 6px; }
  .hero-label { font-size:12px; font-weight:600; letter-spacing:.16em; color:var(--muted); }
  .hero-score { font-size:76px; font-weight:700; letter-spacing:-.02em; color:#fff; line-height:1.1; margin-top:8px; font-variant-numeric:tabular-nums; }
  .hero-score .unit { font-size:20px; font-weight:600; color:var(--muted); margin-left:8px; letter-spacing:0; }
  .hero-level { margin-top:16px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .ring-wrap { position:relative; width:64px; height:64px; }
  .ring-wrap svg { transform:rotate(-90deg); }
  .ring-bg { stroke:rgba(255,255,255,.08); }
  .ring-fg { stroke:url(#ringGrad); stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); filter:drop-shadow(0 0 6px rgba(167,139,250,.45)); }
  .ring-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--muted); }
  .level-tag { font-size:15px; font-weight:700; color:var(--violet); }
  /* 空投提示条 */
  .airdrop-bar {
    margin:24px auto 30px; max-width:560px; text-align:center; padding:12px 18px; border-radius:14px;
    font-size:14px; font-weight:600; color:#1a1420;
    background:linear-gradient(120deg,#f5b042,#a78bfa);
    box-shadow:0 8px 30px rgba(167,139,250,.25);
  }
  /* Bento */
  .bento { display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:118px; grid-auto-flow:dense; gap:14px; }
  .card {
    position:relative; border:1px solid var(--card-border); background:var(--card); border-radius:20px; padding:16px;
    display:flex; flex-direction:column; justify-content:space-between; overflow:hidden;
    transition:transform .25s, box-shadow .25s, border-color .25s;
    opacity:0; transform:translateY(14px); animation:rise .6s ease forwards;
  }
  .card:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35); border-color:rgba(255,255,255,.16); }
  .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.19s}
  .card:nth-child(4){animation-delay:.26s}.card:nth-child(5){animation-delay:.33s}.card:nth-child(6){animation-delay:.40s}
  @keyframes rise { to { opacity:1; transform:none; } }
  .card .icon { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:#d8dce6; }
  .card .icon svg { width:19px; height:19px; }
  .card .name { font-size:13px; font-weight:600; color:#c6ccd8; }
  .card .stat { display:flex; align-items:baseline; justify-content:space-between; }
  .card .count { font-size:13px; color:var(--muted); }
  .card .pts { font-size:16px; font-weight:700; color:var(--gold); }
  .card.big { grid-column:span 4; grid-row:span 2; }
  .card.wide { grid-column:span 3; }
  .card.small { grid-column:span 2; }
  .card.big .big-head { display:flex; align-items:baseline; gap:10px; }
  .card.big .big-score { font-size:38px; font-weight:700; color:#fff; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .card.big .big-sub { font-size:12px; color:var(--muted); }
  .bar { height:5px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#f5b042,#a78bfa); transition:width 1.2s cubic-bezier(.22,1,.36,1); }
  .tagline { text-align:center; margin-top:40px; font-size:13px; letter-spacing:.08em; color:var(--muted); }
  @media (max-width:768px) {
    main { padding:44px 16px 48px; }
    .hero-score { font-size:54px; }
    .bento { grid-template-columns:repeat(2,1fr); grid-auto-rows:104px; }
    .card.big { grid-column:span 2; grid-row:span 2; }
    .card.wide { grid-column:span 2; }
    .card.small { grid-column:span 1; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<button class="back-btn" onclick="history.back()" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
<main>
  <header class="hero">
    <div class="hero-label">贡献值</div>
    <div class="hero-score"><span id="heroScore">0</span><span class="unit">分</span></div>
    <div class="hero-level">
      <div class="ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5b042"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
          <circle class="ring-bg" cx="32" cy="32" r="27" fill="none" stroke-width="5"/>
          <circle class="ring-fg" id="ringFg" cx="32" cy="32" r="27" fill="none" stroke-width="5" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
        </svg>
        <span class="ring-text" id="ringText">0%</span>
      </div>
      <span class="level-tag" id="levelTag">Lv.1</span>
    </div>
  </header>

  <div class="airdrop-bar" id="airdropBar">发币后按贡献值空投</div>

  <section class="bento" id="bento"></section>

  <footer class="tagline">贡献，即未来的 STORY</footer>
</main>
<script>
(function () {
  // 贡献数据：签约读 localStorage（sf2_sign_count），其余为演示值
  var signN = parseInt(localStorage.getItem('sf2_sign_count') || '0', 10) || 0;
  var items = [
    { name: '签约', count: signN || 12, unit: '张', pts: 10, big: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>' },
    { name: '演出', count: 345, unit: 'h', pts: 1, wide: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>' },
    { name: '升级', count: 3, unit: '次', pts: 50, wide: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>' },
    { name: '发布', count: 2, unit: '部', pts: 20, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M8 16V8l8 4-8 4z"/></svg>' },
    { name: '登录', count: 18, unit: '天', pts: 5, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' },
    { name: '互动', count: 86, unit: '次', pts: 1, small: true,
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' },
  ];
  items.forEach(function (it) { it.total = it.count * it.pts; });
  var grand = items.reduce(function (a, b) { return a + b.total; }, 0);

  // 等级：0/1000/3000/6000/10000
  var LEVELS = [0, 1000, 3000, 6000, 10000];
  var NAMES = ['Lv.1 新芽', 'Lv.2 新秀', 'Lv.3 新星', 'Lv.4 引领者', 'Lv.5 共建者'];
  var lv = 0;
  for (var i = 0; i < LEVELS.length; i++) { if (grand >= LEVELS[i]) lv = i; }
  var lo = LEVELS[lv], hi = LEVELS[lv + 1] || Math.round(LEVELS[lv] * 1.6);
  var pct = Math.min(100, Math.round((grand - lo) / (hi - lo) * 100));

  // 大数字滚动
  var scoreEl = document.getElementById('heroScore');
  var t0 = null;
  function tick(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / 1200);
    var e = 1 - Math.pow(1 - p, 3);
    scoreEl.textContent = Math.round(grand * e).toLocaleString();
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  document.getElementById('levelTag').textContent = NAMES[lv];
  document.getElementById('ringText').textContent = pct + '%';
  var C = 2 * Math.PI * 27;
  var fg = document.getElementById('ringFg');
  setTimeout(function () { fg.style.strokeDashoffset = C * (1 - pct / 100); }, 250);

  // 空投提示（按阶段）
  var phase = (window.SFPhase && SFPhase.get()) || 'pre';
  var barTexts = { pre: '发币后按贡献值空投', airdrop: '已按贡献值空投', mining: '挖矿已开放' };
  document.getElementById('airdropBar').textContent = barTexts[phase] || barTexts.pre;

  // Bento 卡片
  var html = '';
  items.forEach(function (it) {
    var cls = it.big ? 'big' : (it.wide ? 'wide' : 'small');
    var inner = '<div class="card ' + cls + '"><div class="icon">' + it.icon + '</div><div class="name">' + it.name + '</div>';
    if (it.big) {
      var share = Math.round(it.total / grand * 100);
      inner += '<div class="big-head"><div class="big-score">' + it.count.toLocaleString() + '</div><div class="big-sub">' + it.unit + ' · +' + it.pts + '/' + it.unit + '</div></div>'
        + '<div class="bar"><i data-w="' + share + '"></i></div>'
        + '<div class="stat"><span class="count">占比 ' + share + '%</span><span class="pts">+' + it.total.toLocaleString() + '分</span></div>';
    } else {
      inner += '<div class="stat"><span class="count">×' + it.count.toLocaleString() + ' ' + it.unit + '</span><span class="pts">+' + it.total + '分</span></div>';
    }
    inner += '</div>';
    html += inner;
  });
  document.getElementById('bento').innerHTML = html;
  setTimeout(function () {
    document.querySelectorAll('.bar i').forEach(function (b) { b.style.width = b.dataset.w + '%'; });
  }, 450);
})();
</script>
</body>
</html>
