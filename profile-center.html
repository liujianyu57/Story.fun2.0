<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story.fun | 个人中心</title>
  <style>
    :root {
      --bg: #F8F9FB;
      --surface: #ffffff;
      --accent: #00b388;
      --accent-soft: rgba(0, 179, 136, 0.12);
      --accent-glow: rgba(0, 179, 136, 0.25);
      --text: #1C2024;
      --text-muted: #60646C;
      --text-sub: #8B8D98;
      --border: #D9D9E0;
      --border-light: #F0F0F3;
      --shadow-sm: 0 4px 12px rgba(27, 45, 71, 0.06);
      --shadow-md: 0 12px 28px rgba(27, 45, 71, 0.07);
      --shadow-lg: 0 20px 45px rgba(27, 45, 71, 0.10);
      --radius: 12px;
      --radius-lg: 16px;
      font-family: "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    .app-shell { max-width: 1440px; margin: 0 auto; padding: 24px; }

    /* Gradient */
    .gradient-text { background: linear-gradient(45deg, #05DF72 0%, #00BBA7 50%, #00B8DB 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-bg { background: linear-gradient(45deg, #05DF72 0%, #00BBA7 50%, #00B8DB 100%); }

    /* Main Content */
    .main-content { padding: 32px 44px 96px; display: flex; flex-direction: column; gap: 32px; }

    /* ===== User Info Header Card ===== */
    .user-info-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow-sm); }
    .user-info-inner { display: flex; align-items: center; gap: 32px; }

    .avatar-wrap { flex-shrink: 0; }
    .avatar-gradient { width: 128px; height: 128px; border-radius: 99px; padding: 4px; background: linear-gradient(45deg, #05DF72 0%, #00BBA7 50%, #00B8DB 100%); box-shadow: 0px 4px 6px -4px rgba(0,0,0,0.1), 0px 10px 15px -3px rgba(0,0,0,0.1); }
    .avatar-bg { width: 100%; height: 100%; border-radius: 88px; background: var(--surface); display: flex; align-items: center; justify-content: center; }
    .avatar-bg .avatar-letter { font-size: 30px; font-weight: 700; }

    .user-info-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .user-info-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .user-info-texts { display: flex; flex-direction: column; gap: 8px; }
    .user-name { font-size: 24px; font-weight: 700; color: var(--text); }

    .btn-edit { padding: 10px 24px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; height: 44px; display: flex; align-items: center; gap: 6px; }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== Tabs ===== */
    .tab-bar { display: flex; align-items: center; gap: 32px; border-bottom: 1px solid var(--border); }
    .tab-item { padding: 14px 0 18px; font-size: 16px; font-weight: 510; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; }
    .tab-item:hover { color: var(--text); }
    .tab-item.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    /* ===== Drama Cards (完全复刻 index.html 短剧卡片) ===== */
    .works-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 22px; margin-bottom: 34px; }

    .work-card { border-radius: 24px; min-height: 450px; display: flex; flex-direction: column; background: var(--surface); box-shadow: 0 12px 30px rgba(0,0,0,0.08); border: 1px solid var(--border); transition: all 0.3s ease; cursor: pointer; overflow: hidden; }
    .work-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
    .work-card .card-thumb { width: 100%; height: 320px; object-fit: cover; border-bottom: 1px solid var(--border); display: block; }
    .work-card .card-body { padding: 24px 26px 20px; flex-grow: 1; }
    .work-card .card-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .work-card .badge, .work-card .episode { display: inline-flex; align-items: center; border-radius: 999px; padding: 10px 14px; font-size: 0.85rem; font-weight: 700; }
    .work-card .badge { background: var(--accent-soft); color: var(--accent); }
    .work-card .episode { background: var(--border-light); color: var(--text-muted); }
    .work-card h3 { margin: 0 0 12px; font-size: 1.4rem; line-height: 1.25; color: var(--text); }
    .work-card p { margin: 12px 0 0; color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
    .work-card .card-actors { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
    .work-card .card-actors-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; white-space: nowrap; }
    .work-card .card-actors-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .work-card .card-actor-item { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: transform 0.2s ease; }
    .work-card .card-actor-item:hover { transform: translateY(-2px); }
    .work-card .card-actor-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--border); flex-shrink: 0; transition: border-color 0.2s ease; }
    .work-card .card-actor-item:hover .card-actor-avatar { border-color: var(--accent); }
    .work-card .card-actor-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .work-card .card-actor-name { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    .work-card .card-foot { padding: 20px 26px 26px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .work-card .info-row { display: flex; flex-wrap: wrap; gap: 12px; color: var(--text-muted); font-size: 0.95rem; }
    .work-card .card-rating { display: inline-flex; align-items: center; gap: 3px; color: #ffc107; font-weight: 600; }
    .work-card .card-rating .star-icon { font-size: 0.82rem; }

    /* Empty State */
    .empty-state { text-align: center; padding: 64px 24px; color: var(--text-sub); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; }

    /* Responsive */
    @media (max-width: 1120px) { .works-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 900px) {
      .main-content { padding: 24px 20px 64px; }
      .user-info-inner { flex-direction: column; align-items: flex-start; gap: 20px; }
      .user-info-top { flex-direction: column; align-items: flex-start; }
      .avatar-gradient { width: 96px; height: 96px; }
    }
    @media (max-width: 760px) { .works-grid { grid-template-columns: 1fr; } }
    @media (max-width: 540px) {
      .works-grid { grid-template-columns: 1fr; }
      .tab-bar { gap: 16px; overflow-x: auto; }
      .tab-item { font-size: 14px; padding: 12px 0 14px; white-space: nowrap; }
      .user-info-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-shell">

    <div class="main-content">
      <!-- User Info Header Card -->
      <div class="user-info-card">
        <div class="user-info-inner">
          <div class="avatar-wrap">
            <div class="avatar-gradient">
              <div class="avatar-bg">
                <span class="avatar-letter gradient-text">叙</span>
              </div>
            </div>
          </div>
          <div class="user-info-body">
            <div class="user-info-top">
              <div class="user-info-texts">
                <div class="user-name" id="profileName">加密小白</div>
              </div>
              <button class="btn-edit" onclick="showToast('🕘 编辑资料开发中')">✎ 编辑</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div>
        <div class="tab-bar">
          <button class="tab-item active" data-tab="published" onclick="switchTab('published')">发布短剧</button>
          <button class="tab-item" data-tab="liked" onclick="switchTab('liked')">点赞</button>
          <button class="tab-item" data-tab="favorited" onclick="switchTab('favorited')">收藏</button>
        </div>
      </div>

      <!-- Works Grid - 发布短剧（完全复刻 index.html 短剧卡片结构） -->
      <div id="tabPublished" class="works-grid">
        <article class="work-card" onclick="location.href='drama-detail.html'">
          <img class="card-thumb" src="image/fenggu_cover.jpg" alt="凤骨琉璃" />
          <div class="card-body">
            <h3>凤骨琉璃</h3>
            <div class="card-meta"><span class="badge">古风</span><span class="episode">全44集</span></div>
            <p>一曲凤骨琉璃，半世浮华若梦。权谋与红颜交织的古风传奇。</p>
            <div class="card-actors">
              <div class="card-actors-list">
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=苏婉清'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80" alt="苏婉清" loading="lazy" /></div>
                  <span class="card-actor-name">苏婉清</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=李云飞'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="李云飞" loading="lazy" /></div>
                  <span class="card-actor-name">李云飞</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=林梦瑶'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="林梦瑶" loading="lazy" /></div>
                  <span class="card-actor-name">林梦瑶</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=上官婉儿'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="上官婉儿" loading="lazy" /></div>
                  <span class="card-actor-name">上官婉儿</span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-foot"><div class="info-row"><span>JACK</span><span>22.3万完播</span><span>333.2万热度</span><span class="card-rating"><span class="star-icon">★</span> 4.8</span></div></div>
        </article>
        <article class="work-card" onclick="location.href='drama-detail.html'">
          <img class="card-thumb" src="image/xiejia_cover.jpg" alt="我卸甲后天下大乱了" />
          <div class="card-body">
            <h3>我卸甲后天下大乱了</h3>
            <div class="card-meta"><span class="badge">古风</span><span class="episode">全12集</span></div>
            <p>卸下铠甲那一刻，天下风云骤变。一段关于权谋、征战与抉择的古风传奇。</p>
            <div class="card-actors">
              <div class="card-actors-list">
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=李云飞'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="李云飞" loading="lazy" /></div>
                  <span class="card-actor-name">李云飞</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=赵无极'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=200&q=80" alt="赵无极" loading="lazy" /></div>
                  <span class="card-actor-name">赵无极</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=林梦瑶'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="林梦瑶" loading="lazy" /></div>
                  <span class="card-actor-name">林梦瑶</span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-foot"><div class="info-row"><span>EVA</span><span>2.4k 观看</span><span>286.5万热度</span><span class="card-rating"><span class="star-icon">★</span> 4.6</span></div></div>
        </article>
        <article class="work-card" onclick="location.href='drama-detail.html'">
          <img class="card-thumb" src="image/chengxiangfu_cover.jpg" alt="丞相府今日开饭" />
          <div class="card-body">
            <h3>丞相府今日开饭</h3>
            <div class="card-meta"><span class="badge">喜剧</span><span class="episode">全24集</span></div>
            <p>丞相府的厨房里藏着天下大势，一道菜引发的朝堂风波。古风美食喜剧。</p>
            <div class="card-actors">
              <div class="card-actors-list">
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=苏婉清'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80" alt="苏婉清" loading="lazy" /></div>
                  <span class="card-actor-name">苏婉清</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=上官婉儿'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="上官婉儿" loading="lazy" /></div>
                  <span class="card-actor-name">上官婉儿</span>
                </div>
                <div class="card-actor-item" onclick="event.stopPropagation(); location.href='actor-profile.html?name=Luna'">
                  <div class="card-actor-avatar"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80" alt="Luna" loading="lazy" /></div>
                  <span class="card-actor-name">Luna</span>
                </div>
              </div>
            </div>
          </div>
          <div class="card-foot"><div class="info-row"><span>LENS</span><span>1.8k 观看</span><span>198.4万热度</span><span class="card-rating"><span class="star-icon">★</span> 4.7</span></div></div>
        </article>
      </div>

      <!-- Empty state for liked / favorited tabs -->
      <div id="tabLiked" class="empty-state" style="display:none;">
        <div class="empty-icon">❤️</div>
        <p>暂无点赞的短剧</p>
      </div>
      <div id="tabFavorited" class="empty-state" style="display:none;">
        <div class="empty-icon">⭐</div>
        <p>暂无收藏的短剧</p>
      </div>
    </div>
  </div>

  <script src="load-header.js"></script>
  <script src="auth.js"></script>
  <script>
    /**
     * Tab switching
     */
    function switchTab(tab) {
      // Update tab buttons
      document.querySelectorAll('.tab-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      // Show/hide content
      document.getElementById('tabPublished').style.display = tab === 'published' ? 'grid' : 'none';
      document.getElementById('tabLiked').style.display = tab === 'liked' ? 'block' : 'none';
      document.getElementById('tabFavorited').style.display = tab === 'favorited' ? 'block' : 'none';
    }

    /**
     * Load user profile from auth.js
     */
    function loadProfile() {
      if (typeof currentUser === 'undefined') {
        setTimeout(loadProfile, 100);
        return;
      }

      const nameEl = document.getElementById('profileName');
      if (nameEl) nameEl.textContent = currentUser.name || '未登录用户';
    }

    // Wait for auth to be ready
    document.addEventListener('DOMContentLoaded', loadProfile);
    document.addEventListener('header-loaded', loadProfile);
  </script>
  <div id="bottom-nav-placeholder"></div>
  <script src="load-bottom-nav.js"></script>
</body>
</html>
