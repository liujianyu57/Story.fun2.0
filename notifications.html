<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>通知消息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8f9fb;
  --surface:#fff;
  --accent:#000000;
  --accent-dim:rgba(0, 0, 0,.08);
  --text:#1a1a2e;
  --text-secondary:#5e6f83;
  --text-muted:#8896a8;
  --border:#eef0f4;
  --danger:#f45b69;
  --warning:#f59e0b;
  --story-green:#000000;
  font-family:"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto;height:100vh;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.04)}

/* Top Bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;padding-top:env(safe-area-inset-top,0)}
.top-bar .back-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.04);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.top-bar .back-btn:active{background:rgba(0,0,0,.08)}

/* Tab Bar — only 2 tabs */
.tab-bar{display:flex;gap:0;padding:0 16px;border-bottom:.5px solid var(--border);background:var(--surface);flex-shrink:0}
.tab-item{flex:1;text-align:center;padding:12px 0 10px;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;position:relative;transition:color .2s;-webkit-tap-highlight-color:transparent;border:none;background:none}
.tab-item.active{color:var(--text);font-weight:600}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:3px;background:var(--accent)}

/* Revenue filter bar */
.rev-filter-bar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;scrollbar-width:none}
.rev-filter-bar::-webkit-scrollbar{display:none}
.rev-filter-chip{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.rev-filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Scroll */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
.scroll::-webkit-scrollbar{width:0}

/* ── Notification Card ── */
.notify-item{
  display:flex;
  flex-direction:column;
  gap:0;
  padding:14px 16px 10px;
  position:relative;
  background:var(--surface);
  border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.03);
  margin:0 12px 10px;
  transition:box-shadow .15s;
}
.notify-item:active{box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* Unread dot */
.notify-item.unread::before{
  content:'';
  position:absolute;
  left:9px;
  top:21px;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ff2d55;
}

/* Revenue card — column layout */
.notify-item[data-category="revenue"]{
  flex-direction:column;
  align-items:stretch;
  gap:0;
  padding:14px 18px 12px;
}
.notify-item[data-category="revenue"].unread::before{
  top:21px;
  transform:none;
}

/* Revenue top row — icon + content */
.revenue-row{
  display:flex;
  align-items:flex-start;
  gap:14px;
}

/* Revenue card — three layer hierarchy */

/* L1: Category label — iOS-style pill badge */
.revenue-title{
  display:inline-block;
  font-size:10px;
  font-weight:600;
  color:var(--accent);
  background:var(--accent-dim);
  padding:3px 8px;
  border-radius:999px;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin-bottom:7px;
}

/* Revenue card body — regular weight */
.notify-item[data-category="revenue"] .notify-desc{
  font-weight:400;
  font-size:14px;
  line-height:1.55;
  color:var(--text);
}

/* L2b: Amount standalone line */
.revenue-amount{
  font-size:15px;
  font-weight:700;
  margin-top:4px;
}
.revenue-amount .rcv-usdc{color:var(--accent)}
.revenue-amount .rcv-story{color:var(--story-green)}

/* L3: Time — ultra subtle */
.notify-item[data-category="revenue"] .notify-meta{
  font-size:11px;
  color:var(--text-muted);
  margin-top:6px;
}

/* Revenue action button — right side, solid accent */
.rev-act-btn{
  flex-shrink:0;
  padding:6px 16px;
  border-radius:999px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  align-self:center;
}
.rev-act-btn:active{opacity:.8}

/* Left icon area */
.notify-icon{
  width:44px;
  height:44px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.notify-icon.avatar{overflow:hidden;background:#f0f2f5}
.notify-icon.avatar img{width:100%;height:100%;object-fit:cover}
.notify-icon.revenue{background:var(--accent-dim)}
.notify-icon.system{background:rgba(94,111,131,.08)}

/* Content */
.notify-content{flex:1;min-width:0}
.notify-desc{font-size:14px;color:var(--text);line-height:1.5;font-weight:500}
.notify-desc strong{font-weight:700}
.notify-desc .amount{font-weight:700}
.notify-desc .amount.usdc{color:var(--accent)}
.notify-desc .amount.story{color:var(--story-green)}
.notify-meta{font-size:12px;color:var(--text-muted);margin-top:3px}
.notify-time{font-size:11px;color:var(--text-muted);opacity:.7;margin-top:2px}

/* Thumbnail — right side of social cards */
.notify-thumb{
  width:44px;
  height:44px;
  border-radius:8px;
  flex-shrink:0;
  overflow:hidden;
  background:#f0f2f5;
}
.notify-thumb img{width:100%;height:100%;object-fit:cover}

/* Social content row — icon + text + thumb */
.social-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex:1;
}

/* Footer bar — "···" at bottom right */
.notify-footer{
  position:relative;
  display:flex;
  justify-content:flex-end;
  margin-top:8px;
}

/* Social action buttons — comment card */
.social-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.social-actions .sact-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-secondary);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
}
.social-actions .sact-btn:active{background:rgba(0,0,0,.03)}

/* Follow button */
.follow-btn{
  flex-shrink:0;
  padding:5px 14px;
  border-radius:999px;
  border:1px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.follow-btn:active{background:var(--accent-dim)}
.follow-btn.followed{
  background:var(--accent-dim);
  color:var(--accent);
  border-color:transparent;
}
.follow-btn.mutual{
  background:var(--accent-dim);
  color:var(--accent);
  border-color:transparent;
}

/* More button */
.notify-more{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:15px;
  cursor:pointer;
  letter-spacing:1px;
  transition:background .15s;
}
.notify-more:active{background:rgba(0,0,0,.04)}

/* Delete dropdown — expands downward */
.delete-dropdown{
  position:absolute;
  top:100%;
  right:0;
  margin-top:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  padding:4px 0;
  min-width:80px;
  z-index:3;
  display:none;
  text-align:center;
}
.delete-dropdown.show{display:block}
.delete-dropdown .delete-btn{
  display:block;
  width:100%;
  padding:8px 16px;
  border:none;
  background:transparent;
  color:var(--danger);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:background .15s;
  border-radius:0;
}
.delete-dropdown .delete-btn:active{background:rgba(244,91,105,.06)}

/* Empty state */
.notify-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  color:var(--text-muted);
  gap:12px;
}
.notify-empty .empty-icon{font-size:40px;opacity:.3}
.notify-empty p{font-size:14px}

/* Text emphasis inside desc */
.em-green{color:var(--story-green);font-weight:700}
.em-teal{color:var(--accent);font-weight:700}
</style>
</head>

<script>
// ============================================================
//  通知设置联动：统一根据「激活 tab + 激活筛选 + 通知设置」计算每个条目的可见性
// ============================================================
function applyNotifyVisibility() {
  var activeTab = document.querySelector('.tab-item.active');
  var tab = activeTab ? activeTab.dataset.tab : 'revenue';

  // 读取激活的筛选 chip（收益/互动各一组）
  var activeRevChip = document.querySelector('#revFilterBar .rev-filter-chip.active');
  var activeSocChip = document.querySelector('#socFilterBar .rev-filter-chip.active');
  var revType = activeRevChip ? activeRevChip.dataset.revtype : 'all';
  var soType = activeSocChip ? activeSocChip.dataset.sotype : 'all';

  var masterOff = (typeof window.StoryFunNotify === 'undefined') ? false : !window.StoryFunNotify.getSettings().master;

  document.querySelectorAll('.notify-item').forEach(function(item) {
    var cat = item.getAttribute('data-category');
    var subType = cat === 'revenue' ? item.getAttribute('data-revtype') : item.getAttribute('data-sotype');

    // 1) 总开关关闭 → 全部隐藏
    if (masterOff) { item.style.display = 'none'; return; }
    // 2) 该类型在设置中被关闭 → 隐藏
    if (typeof window.StoryFunNotify !== 'undefined' && !window.StoryFunNotify.isNotifyEnabled(cat, subType)) {
      item.style.display = 'none'; return;
    }
    // 3) tab 不匹配 → 隐藏
    if (cat !== tab) { item.style.display = 'none'; return; }
    // 4) 筛选 chip 不匹配 → 隐藏
    if (cat === 'revenue' && revType !== 'all' && item.getAttribute('data-revtype') !== revType) { item.style.display = 'none'; return; }
    if (cat === 'social' && soType !== 'all' && item.getAttribute('data-sotype') !== soType) { item.style.display = 'none'; return; }
    item.style.display = 'flex';
  });

  renderEmpty();
}

// Tab switching
var revFilterBar = document.getElementById('revFilterBar');
var socFilterBar = document.getElementById('socFilterBar');
document.querySelectorAll('.tab-item').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
    this.classList.add('active');
    var v = this.dataset.tab;
    // Show/hide filter bars
    if(revFilterBar) revFilterBar.style.display = v === 'revenue' ? 'flex' : 'none';
    if(socFilterBar) socFilterBar.style.display = v === 'social' ? 'flex' : 'none';
    // Reset active filters
    var activeBar = v === 'revenue' ? revFilterBar : socFilterBar;
    if(activeBar){
      activeBar.querySelectorAll('.rev-filter-chip').forEach(function(c){c.classList.remove('active')});
      var allChip = activeBar.querySelector('[data-revtype="all"], [data-sotype="all"]');
      if(allChip) allChip.classList.add('active');
    }
    applyNotifyVisibility();
  });
});

// Revenue filter — listen on revFilterBar only
if(revFilterBar){
  revFilterBar.querySelectorAll('.rev-filter-chip').forEach(function(chip){
    chip.addEventListener('click',function(){
      revFilterBar.querySelectorAll('.rev-filter-chip').forEach(function(c){c.classList.remove('active')});
      this.classList.add('active');
      applyNotifyVisibility();
    });
  });
}

// Social filter — listen on socFilterBar only
if(socFilterBar){
  socFilterBar.querySelectorAll('.rev-filter-chip').forEach(function(chip){
    chip.addEventListener('click',function(){
      socFilterBar.querySelectorAll('.rev-filter-chip').forEach(function(c){c.classList.remove('active')});
      this.classList.add('active');
      applyNotifyVisibility();
    });
  });
}

// Show empty state when no items
function renderEmpty(){
  var activeTab = document.querySelector('.tab-item.active').dataset.tab;
  var scroll = document.querySelector('.scroll');

  // Remove existing empty states
  scroll.querySelectorAll('.notify-empty').forEach(function(e){e.remove()});

  // 总开关关闭 → 统一提示
  var masterOff = (typeof window.StoryFunNotify !== 'undefined') && !window.StoryFunNotify.getSettings().master;
  if (masterOff) {
    var emptyAll = document.createElement('div');
    emptyAll.className = 'notify-empty';
    emptyAll.innerHTML = '<div class="empty-icon">🔕</div><p>已关闭全部通知，可在「设置 → 通知设置」中开启</p>';
    scroll.appendChild(emptyAll);
    return;
  }

  var visible = document.querySelectorAll('.notify-item[data-category="'+activeTab+'"]');
  var allHidden = true;
  visible.forEach(function(item){
    if(item.style.display !== 'none') allHidden = false;
  });

  if(allHidden){
    var msg = activeTab === 'revenue' ? '暂无收益通知' : '暂无互动通知';
    var empty = document.createElement('div');
    empty.className = 'notify-empty';
    empty.innerHTML = '<div class="empty-icon">'+ (activeTab==='revenue'?'📭':'💬') +'</div><p>'+msg+'</p>';
    scroll.appendChild(empty);
  }
}

// More / Delete
function toggleDelete(e, btn){
  e.stopPropagation();
  // Close all other dropdowns
  document.querySelectorAll('.delete-dropdown.show').forEach(function(d){
    if(d.parentElement !== btn.parentElement) d.classList.remove('show');
  });
  var dd = btn.parentElement.querySelector('.delete-dropdown');
  dd.classList.toggle('show');
}

function deleteNotify(e, btn){
  e.stopPropagation();
  btn.closest('.notify-item').remove();
}

// Follow button toggle
function toggleFollow(btn){
  if(btn.classList.contains('mutual')){
    btn.classList.remove('mutual');
    btn.classList.add('followed');
    btn.textContent = '已关注';
  } else if(btn.classList.contains('followed')){
    btn.classList.remove('followed');
    btn.textContent = '关注';
  } else {
    btn.classList.add('followed');
    btn.textContent = '已关注';
  }
}

// Close dropdowns on outside click
document.addEventListener('click', function(){
  document.querySelectorAll('.delete-dropdown.show').forEach(function(d){d.classList.remove('show')});
});

// Initial — show revenue tab
(function init(){
  applyNotifyVisibility();
})();
</script>
