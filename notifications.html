<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>通知消息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fb;--surface:#fff;--accent:#00b388;--text:#1a1a2e;--text-muted:#8896a8;--border:#eef0f4;font-family:"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{width:100%;height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto;height:100vh;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.04)}
.top-bar{display:flex;align-items:center;justify-content:center;height:52px;padding:0 16px;padding-top:env(safe-area-inset-top,0);position:relative;border-bottom:.5px solid var(--border)}
.top-bar .back-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.04);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.top-bar .back-btn:active{background:rgba(0,0,0,.08)}
.top-bar h1{font-size:16px;font-weight:700;color:var(--text)}
/* 顶部 Tab */
.tab-bar{display:flex;gap:0;padding:0 16px;border-bottom:.5px solid var(--border);background:var(--surface);flex-shrink:0}
.tab-item{flex:1;text-align:center;padding:12px 0 10px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;position:relative;transition:color .2s;-webkit-tap-highlight-color:transparent;border:none;background:none;white-space:nowrap}
.tab-item.active{color:var(--text);font-weight:600}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:3px;background:var(--accent)}
.tab-item:active{opacity:.7}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.notify-item{display:flex;align-items:center;gap:12px;padding:14px 16px;transition:all .2s;cursor:pointer;margin:8px 16px;border-radius:14px;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.04);border:.5px solid var(--border);position:relative}
.notify-item:active{transform:scale(.97);box-shadow:0 0 0 rgba(0,0,0,.02)}
.notify-item.unread{border-color:rgba(0,179,136,.25);box-shadow:0 0 0 .5px rgba(0,179,136,.15),0 1px 4px rgba(0,179,136,.06)}
.notify-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.notify-content{flex:1;min-width:0}
.notify-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:3px}
.notify-desc{font-size:13px;color:var(--text-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notify-time{font-size:11px;color:rgba(136,150,168,.6);margin-top:4px}
.notify-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-muted);gap:12px}
.notify-empty div{font-size:36px;opacity:.4}
.notify-empty p{font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">‹</button>
    <h1>通知消息</h1>
  </div>
  <div class="tab-bar">
    <button class="tab-item active" data-tab="all">全部</button>
    <button class="tab-item" data-tab="comment">评论</button>
    <button class="tab-item" data-tab="like">点赞</button>
    <button class="tab-item" data-tab="system">系统通知</button>
    <button class="tab-item" data-tab="follow">粉丝</button>
  </div>
  <div class="scroll">
        <div class="notify-item unread">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">苏婉清 评论了你的作品</div>
        <div class="notify-desc">好好看的剧情！尤其是第3集的反转，真的没想到会这样发展，期待后续更新🔥</div>
        <div class="notify-time">12分钟前</div>
      </div>
    </div>
    <div class="notify-item unread">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">李云飞 点赞了你的收藏</div>
        <div class="notify-desc">给你收藏的「凤骨琉璃」点了个赞</div>
        <div class="notify-time">28分钟前</div>
      </div>
    </div>
    <div class="notify-item unread">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">系统通知</div>
        <div class="notify-desc">你的短剧《凤骨琉璃》累计完播突破 10 万次，获得「热门剧集」徽章🎉</div>
        <div class="notify-time">2小时前</div>
      </div>
    </div>
        <div class="notify-item">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">上官婉儿 关注了你</div>
        <div class="notify-desc">我是上官婉儿，很喜欢你的短剧，互关一下～</div>
        <div class="notify-time">昨天 15:32</div>
      </div>
    </div>
    <div class="notify-item">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">赵无极 评论了你</div>
        <div class="notify-desc">第7集的打斗场面太燃了！BGM也很搭</div>
        <div class="notify-time">昨天 09:15</div>
      </div>
    </div>
        <div class="notify-item">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">新粉丝</div>
        <div class="notify-desc">Luna、林梦瑶、上官婉儿等 8 人关注了你</div>
        <div class="notify-time">3天前</div>
      </div>
    </div>
    <div class="notify-item">
      <img class="notify-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="">
      <div class="notify-content">
        <div class="notify-title">系统通知</div>
        <div class="notify-desc">恭喜！你的作品《凤骨琉璃》登上热门推荐榜单</div>
        <div class="notify-time">5天前</div>
      </div>
    </div>
  </div>
</div>
<script>
/* 给消息打上分类标签 */
document.querySelectorAll('.notify-item').forEach(function(el,i){
  var title = el.querySelector('.notify-title').textContent;
  if(title.indexOf('评论')>=0) el.setAttribute('data-category','comment');
  else if(title.indexOf('点赞')>=0) el.setAttribute('data-category','like');
  else if(title.indexOf('系统')>=0) el.setAttribute('data-category','system');
  else if(title.indexOf('粉丝')>=0||title.indexOf('关注')>=0) el.setAttribute('data-category','follow');
  else el.setAttribute('data-category','other');
});
/* Tab 切换 */
document.querySelectorAll('.tab-item').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
    this.classList.add('active');
    var v = this.dataset.tab;
    document.querySelectorAll('.notify-item').forEach(function(item){
      item.style.display = (v==='all'||item.getAttribute('data-category')===v) ? 'flex' : 'none';
    });
  });
});
</script>
</body>
</html>
